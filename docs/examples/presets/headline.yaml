headline:
    presets:
        section_header_center:
            title:
                en: 'Centered Section Header'
                tr: 'Ortalanmış Bölüm Başlığı'
            description:
                en: 'Centered H2 heading with extra-large typography and bottom spacing'
                tr: 'Büyük tipografili ve alt boşluklu ortalanmış H2 bölüm başlığı'
            props:
                tag: 'h2'
                size: 'xl'
                title_color: 'default'
                title_decoration: 'none'
                title_text_stroke: 'no'
                text_align: 'center'
                margin_top: 'sm'
                margin_bottom: 'lg'
            values:
                title: 'Öne Çıkan Çözümlerimiz'

        underlined_accent:
            title:
                en: 'Underlined Accent Title'
