                en: '2XL primary hero H1 headline for landing page banners'
                tr: 'Açılış bölümleri için ekstra büyük birincil renkli H1 manşet başlığı'
            props:
                tag: 'h1'
                size: '2xl'
                title_color: 'primary'
                title_decoration: 'none'
                title_text_stroke: 'no'
                text_align: 'center'
