scroll_to:
    presets:
        classic_totop:
            title:
              tr: "Klasik Başa Dön Butonu"
              en: "Classic Back to Top Button"
            description:
              tr: "Sayfanın en sağına yerleşen yuvarlak yukarı ok butonu"
              en: "Right-aligned circle up-arrow button that scrolls to top"
            props:
              display_mode: "totop_circle"
              button_color: "dark"
              align: "right"
              margin_top: "md"
              margin_bottom: "md"

        floating_totop:
            title:
              tr: "Yüzen Başa Dön Butonu"
              en: "Floating Back to Top Button"
            description:
              tr: "Ekranın sağ alt köşesinde sabit duran yüzen buton"
              en: "Fixed floating circle button at the bottom-right corner of the screen"
            props:
              display_mode: "floating"
              button_color: "primary"

        section_anchor:
            title:
              tr: "Bölüm Atlama Butonu"
              en: "Section Anchor Jump Button"
            description:
              tr: "Belirli bir sayfadaki bölüme kaydıran etiketli buton"
              en: "Labeled button that smoothly scrolls to a specific section ID"
            props:
              display_mode: "inline_button"
              button_variant: "solid"
              button_color: "primary"
              align: "center"
              margin_top: "md"
              margin_bottom: "md"
