alert:
    presets:
        info_soft:
            title:
                tr: "Bilgilendirme Kutusu (Mavi Soft)"
                en: "Info Box (Blue Soft)"
            description:
                tr: "Yumuşak mavi zemin, bilgi ikonu ve standart yuvarlatılmış köşeler"
                en: "Soft blue background with info icon and rounded corners"
            props:
                alert_style: "info"
                alert_variant: "soft"
                dismissible: "no"
                icon_display: "auto"
                rounded: "xl"
                margin_bottom: "md"

        success_dismissible:
            title:
                tr: "Kapatılabilir Başarı Bildirimi"
                en: "Dismissible Success Alert"
            description:
                tr: "Yeşil pastel zemin, onay ikonu ve kapatma (X) butonu"
                en: "Green soft background with check icon and dismiss button"
            props:
                alert_style: "success"
                alert_variant: "soft"
                dismissible: "yes"
                icon_display: "auto"
                rounded: "xl"
                margin_bottom: "md"

        warning_outline:
            title:
                tr: "Çerçeveli Uyarı Kutusu"
                en: "Outline Warning Notice"
            description:
                tr: "Sarı/turuncu çerçeve ve dikkat çekici ikaz ikonu"
                en: "Yellow/amber outline border with warning icon"
            props:
                alert_style: "warning"
                alert_variant: "outline"
                dismissible: "no"
                icon_display: "auto"
                rounded: "xl"
                margin_bottom: "md"

        danger_solid:
            title:
                tr: "Kırmızı Vurgulu Hata Kutusu"
                en: "Solid Danger Alert"
            description:
                tr: "Kırmızı doygun zemin ve beyaz yüksek kontrastlı metin"
                en: "Solid red background with high contrast white text"
            props:
                alert_style: "danger"
                alert_variant: "solid"
                dismissible: "yes"
                icon_display: "auto"
                rounded: "xl"
                margin_bottom: "md"
