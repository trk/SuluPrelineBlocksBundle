image:
    presets:
        rounded_card_image:
            title:
                tr: "Yuvarlak Köşeli Görsel (XL)"
                en: "Rounded Card Image (XL)"
            description:
                tr: "16:9 oranında, XL yuvarlatılmış ve zoom hover efektli görsel"
                en: "16:9 ratio, XL rounded with zoom hover effect"
            props:
                aspect_ratio: "16/9"
                rounded: "xl"
                hover_effect: "zoom"
                block_align: "center"
                margin_bottom: "md"

        avatar_circle:
            title:
                tr: "Dairesel Portre (1:1 / Full)"
                en: "Circular Portrait (1:1 / Full)"
            description:
                tr: "Birebir kare oranında tam dairesel görsel"
                en: "Square 1:1 ratio full circular image"
            props:
                aspect_ratio: "1/1"
                rounded: "full"
                hover_effect: "none"
                block_align: "center"
                margin_bottom: "sm"
