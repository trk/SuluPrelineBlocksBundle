divider:
    presets:
        standard_line:
            title:
                tr: "Standart Düz Ayırıcı"
                en: "Standard Solid Line"
            description:
                tr: "Tam genişlikte sade açık gri ayırıcı çizgi"
                en: "Full-width subtle neutral divider line"
            props:
                divider_style: "line"
                divider_color: "default"
                divider_thickness: "1"
                divider_width: "full"
                margin_top: "md"
                margin_bottom: "md"

        accent_bar:
            title:
                tr: "Renkli Kısa Vurgu Çizgisi"
                en: "Accent Short Bar"
            description:
                tr: "Başlık altlarında kullanılan 4px kalınlığında birincil renkli çizgi"
                en: "4px thick primary color bar typically placed under headlines"
            props:
                divider_style: "small"
                divider_color: "primary"
                divider_thickness: "4"
                divider_width: "small"
                divider_align: "left"
                margin_top: "sm"
                margin_bottom: "md"

        dashed_divider:
            title:
                tr: "Kesikli Çizgi"
                en: "Dashed Divider"
            description:
                tr: "Bölümler arasında kesikli modern ayırıcı"
                en: "Modern dashed section break"
            props:
                divider_style: "dashed"
                divider_color: "default"
                divider_thickness: "1"
                divider_width: "full"
                margin_top: "lg"
                margin_bottom: "lg"

        center_icon_divider:
            title:
                tr: "Ortasında İkonlu Ayırıcı"
                en: "Centered Icon Divider"
            description:
                tr: "İki yana uzanan çizgiler ve ortada şık ikon rozeti"
                en: "Lines extending on both sides with a stylish center icon"
            props:
                divider_style: "icon"
                divider_color: "default"
                divider_thickness: "1"
                divider_width: "full"
                divider_align: "center"
                margin_top: "lg"
                margin_bottom: "lg"
