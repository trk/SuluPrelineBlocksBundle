card:
    presets:
        blog_standard:
            title:
                tr: "Standart Blog Kartı (Dikey)"
                en: "Standard Blog Card (Vertical)"
            description:
                tr: "Üstte 16:9 görsel, başlık üstünde rozet ve standart çizgili kart yapısı"
                en: "16:9 media on top, badge above title and standard bordered card"
            props:
                media_align: "top"
                media_aspect_ratio: "16-9"
                meta_align: "above-title"
                variant: "bordered"
                bg_color: "white"
                title_element: "h3"
                title_size: "md"
                rounded: "xl"
                padding: "normal"
                margin_bottom: "md"

        horizontal_news:
            title:
                tr: "Yatay Haber / Makale Kartı"
                en: "Horizontal Article Card"
            description:
                tr: "Solda 1/3 oranında görsel, sağda içerik ve etkileşimli hover efekti"
                en: "1/3 media column on the left, content on right with hover lift"
            props:
                media_align: "left"
                media_width: "1-3"
                media_aspect_ratio: "auto"
                meta_align: "above-title"
                variant: "interactive"
                bg_color: "white"
                title_element: "h3"
                title_size: "lg"
                rounded: "xl"
                padding: "normal"
                margin_bottom: "md"

        featured_overlay:
            title:
                tr: "Vurgulu Tam Zemin (Overlay)"
                en: "Featured Background Overlay"
            description:
                tr: "Görsel arkada tam zemin, degrade karartma ve beyaz tipografi"
                en: "Full background media with gradient overlay and high-contrast typography"
            props:
                media_align: "overlay"
                meta_align: "above-title"
                meta_badge_style: "primary_pill"
                title_element: "h2"
                title_size: "xl"
                variant: "shadow"
                rounded: "2xl"
                padding: "spacious"
                margin_bottom: "lg"

        media_between:
            title:
                tr: "Başlık Üstte - Görsel Ortada (Between)"
                en: "Title First - Media Between"
            description:
                tr: "Önce başlık, ortada görsel, altta açıklama ve butonlar"
                en: "Title and badge first, media in the middle, content and actions below"
            props:
                media_align: "between"
                media_aspect_ratio: "16-9"
                meta_align: "above-title"
                variant: "bordered"
                bg_color: "white"
                title_element: "h3"
                title_size: "lg"
                rounded: "xl"
                padding: "normal"
                margin_bottom: "md"

        clean_minimal:
            title:
                tr: "Minimal & Çizgili (Flat)"
                en: "Minimal & Clean"
            description:
                tr: "Kenarlıksız temiz arka plan, altı çizgili başlık ve yumuşak gri tonlar"
                en: "Border-free clean background with underlined heading"
            props:
                variant: "flat"
                bg_color: "muted"
                media_align: "top"
                media_aspect_ratio: "16-9"
                meta_align: "below-title"
                title_decoration: "underline"
                title_size: "md"
                rounded: "xl"
                padding: "compact"
                margin_bottom: "md"
