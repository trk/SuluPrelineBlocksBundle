button:
    presets:
        primary_pill:
            title:
                tr: "Birincil Yuvarlak (Primary Pill)"
                en: "Primary Pill"
            description:
                tr: "Tam yuvarlak, canlı birincil renkli geniş buton"
                en: "Full rounded, primary color prominent button"
            props:
                variant: "solid"
                link_color: "primary"
                size: "lg"
                margin_top: "sm"
                margin_bottom: "sm"

        ghost_subtle:
            title:
                tr: "Hayalet (Ghost) Buton"
                en: "Ghost Subtle"
            description:
                tr: "Arka plansız, hover olunca belirginleşen zarif buton"
                en: "Transparent button revealing on hover"
            props:
                variant: "ghost"
                link_color: "dark"
                size: "md"

        outline_action:
            title:
                tr: "Çizgisel Vurgulu (Outline)"
                en: "Outline Action"
            description:
                tr: "Kenarlıklı, ikincil renkli şık buton"
                en: "Secondary colored bordered button"
            props:
                variant: "outline"
                link_color: "secondary"
                size: "md"
