video:
    presets:
        standard_cinema:
            title:
                tr: "Sinema Formatı (16:9 / LG)"
                en: "Cinema Format (16:9 / LG)"
            description:
                tr: "Standart 16:9 geniş ekran ve yuvarlatılmış köşeler"
                en: "Standard 16:9 widescreen video with rounded corners"
            props:
                aspect_ratio: "16/9"
                rounded: "lg"
                box_shadow: "md"
                controls: "true"
                margin_bottom: "lg"

        reel_vertical:
            title:
                tr: "Dikey Video / Shorts (9:16 / XL)"
                en: "Vertical / Shorts (9:16 / XL)"
            description:
                tr: "Dikey 9:16 formatında mobil video döngüsü"
                en: "Vertical 9:16 mobile format video loop"
            props:
                aspect_ratio: "9/16"
                rounded: "xl"
                autoplay: "true"
                loop: "true"
                muted: "true"
                controls: "false"
                box_shadow: "lg"
                margin_bottom: "md"

        ambient_showcase:
            title:
                tr: "Arka Plan / Görünürde Otomatik Oynat (2XL)"
                en: "Ambient Inview Autoplay (2XL)"
            description:
                tr: "Görüş alanına girdiğinde otomatik başlayan sessiz video vitrini"
                en: "Silent ambient video playing when scrolled into viewport"
            props:
                aspect_ratio: "16/9"
                rounded: "2xl"
                autoplay: "inview"
                loop: "true"
                muted: "true"
                controls: "false"
                box_shadow: "2xl"
                margin_bottom: "xl"

        ultrawide_floating:
            title:
                tr: "Ultra Geniş Sinematik (21:9)"
                en: "Ultra-wide Cinematic (21:9)"
            description:
                tr: "21:9 oranında sinematik geniş video oynatıcı"
                en: "Ultra-wide 21:9 cinematic video player with deep elevation"
            props:
                aspect_ratio: "21/9"
                rounded: "xl"
                box_shadow: "xl"
                controls: "true"
                margin_bottom: "xl"
