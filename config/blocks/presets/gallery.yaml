presets:
  - id: "modern_photo_grid"
    name:
      en: "4-Column Modern Photo Grid"
      tr: "4 Sütunlu Modern Fotoğraf Izgarası"
    description:
      en: "4-column responsive photo showcase with hover zoom and modal lightbox"
      tr: "Yakınlaşma efektli ve büyük görsel pencereli 4 sütunlu galeri"
    props:
      columns_default: "1"
      columns_sm: "2"
      columns_md: "3"
      columns_lg: "4"
      gap: "md"
      media_aspect_ratio: "4/3"
      overlay_position: "bottom"
      overlay_style: "gradient"
      image_transition: "zoom"
      rounded: "xl"
      lightbox: true

  - id: "square_portfolio"
    name:
      en: "Square Filterable Portfolio"
      tr: "Kare Filtrelenebilir Portfolyo"
    description:
      en: "Square 1:1 ratio images with category pills filter and center caption"
      tr: "Kategori hap filtreli ve ortalanmış yazılı 1:1 kare görseller"
    props:
      columns_default: "1"
      columns_sm: "2"
      columns_md: "3"
      columns_lg: "3"
      gap: "lg"
      media_aspect_ratio: "1/1"
      overlay_position: "center"
      overlay_style: "dark"
      overlay_transition: "fade"
      image_transition: "zoom"
      rounded: "2xl"
      filter: true
      filter_style: "pills"
      lightbox: true
