          en: "Padding"
          tr: "İç Boşluk"
        default: "normal"
        col_span: 6
        options:
          - value: "none"
            label:
              en: "None"
              tr: "Boşluksuz"
          - value: "compact"
            label:
              en: "Compact"
              tr: "Dar"
          - value: "normal"
            label:
              en: "Normal"
              tr: "Standart"
          - value: "spacious"
            label:
              en: "Spacious"
              tr: "Geniş"
      rounded:
        type: select
        label:
          en: "Border Radius"
          tr: "Köşe Yuvarlama"
        default: "xl"
        col_span: 6
        options:
          - value: "none"
