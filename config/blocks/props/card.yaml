          - value: "xl"
            label:
              en: "Standard"
              tr: "Standart (xl)"
          - value: "2xl"
            label:
              en: "Large"
              tr: "Belirgin (2xl)"
          - value: "3xl"
            label:
              en: "Extra Large"
              tr: "Geniş (3xl)"
      link_card:
        type: select
        label:
          en: "Clickable Area"
          tr: "Tıklanabilir Alan"
        default: "none"
