        type: select
        label:
          en: 'Overlay Transition'
          tr: 'Katman Geçiş Animasyonu'
          de: Overlay-Übergang
          ru: 'Переход наложения'
          es: 'Transición de Superposición'
          fr: 'Transition de Superposition'
        default: fade
        col_span: 6
        options:
          - { value: fade, label: { en: Fade, tr: 'Belirme', de: 'Einblenden', ru: 'Плавное появление', es: 'Desvanecer', fr: 'Fondu' } }
          - { value: slide_top, label: { en: 'Slide from Top', tr: 'Yukarıdan Kayma', de: 'Von oben gleiten', ru: 'Скольжение сверху', es: 'Deslizar desde Arriba', fr: 'Glisser depuis le Haut' } }
          - { value: slide_bottom, label: { en: 'Slide from Bottom', tr: 'Aşağıdan Kayma', de: 'Von unten gleiten', ru: 'Скольжение снизу', es: 'Deslizar desde Abajo', fr: 'Glisser depuis le Bas' } }
