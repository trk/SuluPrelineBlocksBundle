        type: select
        label:
          en: 'Overlay Transition'
          tr: 'Katman Geçiş Animasyonu'
          de: Overlay-Übergang
          ru: 'Переход наложения'
          es: 'Transición de Superposición'
          fr: 'Transition de Superposition'
        default: fade
        col_span: 6
        options:
          - { value: fade, label: { en: Fade, tr: 'Belirme (Fade)', de: 'Einblenden (Fade)', ru: 'Плавное появление (Fade)', es: 'Desvanecer (Fade)', fr: 'Fondu (Fade)' } }
          - { value: slide_top, label: { en: 'Slide from Top', tr: 'Yukarıdan Kayma', de: 'Von oben gleiten', ru: 'Скольжение сверху', es: 'Deslizar desde Arriba', fr: 'Glisser depuis le Haut' } }
          - { value: slide_bottom, label: { en: 'Slide from Bottom', tr: 'Aşağıdan Kayma', de: 'Von unten gleiten', ru: 'Скольжение снизу', es: 'Deslizar desde Abajo', fr: 'Glisser depuis le Bas' } }
          - { value: zoom_in, label: { en: 'Zoom In', tr: 'Yakınlaşma (Zoom In)', de: 'Heranzoomen (Zoom In)', ru: 'Увеличение (Zoom In)', es: 'Acercar (Zoom In)', fr: 'Zoom Avant' } }
      image_transition:
        type: select
        label:
          en: 'Image Hover Effect'
          tr: 'Görsel Üzerine Gelme Etkisi'
          de: Bild-Hover-Effekt
          ru: 'Эффект при наведении на фото'
          es: 'Efecto Hover de Imagen'
          fr: "Effet de Survol d'Image"
