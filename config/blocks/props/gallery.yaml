        type: select
        label:
          en: 'Filter Style'
          tr: 'Filtre Stili'
          de: Filter-Stil
          ru: 'Стиль фильтра'
          es: 'Estilo de Filtro'
          fr: 'Style de Filtre'
        default: pills
        col_span: 6
        options:
          - { value: pills, label: { en: 'Pills (Preline Soft)', tr: 'Kapsül Butonlar', de: 'Pillen (Sanft)', ru: 'Капсулы (Мягкие)', es: 'Píldoras (Suaves)', fr: 'Pilules (Douces)' } }
          - { value: tabs, label: { en: 'Underline Tabs', tr: 'Alt Çizgili Sekmeler', de: 'Unterstrichene Tabs', ru: 'Подчёркнутые вкладки', es: 'Pestañas Subrayadas', fr: 'Onglets Soulignés' } }
          - { value: buttons, label: { en: 'Outline Buttons', tr: 'Çizgili Butonlar', de: 'Umrandete Buttons', ru: 'Контурные кнопки', es: 'Botones con Contorno', fr: 'Boutons avec Contour' } }
      filter_align:
        type: select
        label:
          en: 'Filter Alignment'
          tr: 'Filtre Hizalaması'
