        col_span: 6
        options:
          - { value: none, label: { en: None, tr: Yok, de: Keine, ru: Нет, es: Ninguno, fr: Aucun } }
          - { value: sm, label: { en: Small, tr: 'Küçük', de: 'Klein', ru: 'Малый', es: 'Pequeño', fr: 'Petit' } }
          - { value: md, label: { en: Medium, tr: 'Orta', de: 'Mittel', ru: 'Средний', es: 'Mediano', fr: 'Moyen' } }
          - { value: lg, label: { en: Large, tr: 'Büyük', de: 'Groß', ru: 'Большой', es: 'Grande', fr: 'Grand' } }
          - { value: xl, label: { en: 'Extra Large', tr: 'Çok Büyük', de: 'Extra Groß', ru: 'Очень большой', es: 'Extra Grande', fr: 'Très Grand' } }
          - { value: 2xl, label: { en: 2XL, tr: 2XL, de: 2XL, ru: 2XL, es: 2XL, fr: 2XL } }
          - { value: 3xl, label: { en: 3XL, tr: 3XL, de: 3XL, ru: 3XL, es: 3XL, fr: 3XL } }
