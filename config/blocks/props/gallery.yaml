        type: select
        label:
          en: 'Overlay Content Position'
          tr: 'Katman Konumu'
          de: Overlay-Inhaltsposition
          ru: 'Позиция наложения'
          es: 'Posición del Contenido Superpuesto'
          fr: 'Position du Contenu Superposé'
        default: bottom
        col_span: 6
        options:
          - { value: bottom, label: { en: Bottom, tr: Alt, de: Unten, ru: Снизу, es: Abajo, fr: Bas } }
          - { value: center, label: { en: Center, tr: Ortalı, de: Zentriert, ru: 'По центру', es: Centro, fr: Centre } }
          - { value: top, label: { en: Top, tr: Üst, de: Oben, ru: Сверху, es: Arriba, fr: Haut } }
          - { value: cover, label: { en: 'Full Cover', tr: 'Tüm Yüzey (Cover)', de: 'Vollflächig (Cover)', ru: 'Полное покрытие (Cover)', es: 'Cobertura Completa (Cover)', fr: 'Couverture Complète (Cover)' } }
      overlay_style:
        type: select
        label:
          en: 'Overlay Style'
          tr: 'Katman Stili'
          de: Overlay-Stil
          ru: 'Стиль наложения'
          es: 'Estilo de Superposición'
          fr: 'Style de Superposition'
        default: gradient
        col_span: 6
        options:
          - { value: gradient, label: { en: 'Dark Gradient', tr: 'Koyu Degrade', de: 'Dunkler Verlauf', ru: 'Тёмный градиент', es: 'Degradado Oscuro', fr: 'Dégradé Sombre' } }
          - { value: dark, label: { en: 'Dark Backdrop', tr: 'Koyu Zemin', de: 'Dunkler Hintergrund', ru: 'Тёмный фон', es: 'Fondo Oscuro', fr: 'Arrière-plan Sombre' } }
          - { value: light, label: { en: 'Light Backdrop', tr: 'Açık Zemin', de: 'Heller Hintergrund', ru: 'Светлый фон', es: 'Fondo Claro', fr: 'Arrière-plan Clair' } }
          - { value: primary, label: { en: 'Primary Tint', tr: 'Birincil Renk (Primary)', de: 'Primäre Tönung', ru: 'Основной оттенок', es: 'Tinte Primario', fr: 'Teinte Primaire' } }
