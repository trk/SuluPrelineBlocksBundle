        type: select
        label:
          en: 'Media Aspect Ratio'
          tr: 'Görsel En-Boy Oranı'
          de: Medien-Seitenverhältnis
          ru: 'Соотношение сторон медиа'
          es: 'Relación de Aspecto Multimedia'
          fr: 'Format du Média'
        default: 4/3
        col_span: 6
        options:
          - { value: 1/1, label: { en: 'Square', tr: 'Kare', de: 'Quadrat', ru: 'Квадрат', es: 'Cuadrado', fr: 'Carré' } }
          - { value: 4/3, label: { en: 'Standard', tr: 'Standart', de: 'Standard', ru: 'Стандартный', es: 'Estándar', fr: 'Standard' } }
          - { value: 16/9, label: { en: 'Widescreen', tr: 'Geniş Ekran', de: 'Breitbild', ru: 'Широкоэкранный', es: 'Panorámico', fr: 'Écran Large' } }
