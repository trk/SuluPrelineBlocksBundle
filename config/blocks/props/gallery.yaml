        col_span: 6
        options:
          - { value: none, label: { en: 'Disabled (Standard Grid)', tr: 'Kapalı (Standart Izgara)', de: 'Deaktiviert (Standard-Raster)', ru: 'Отключено (Стандартная сетка)', es: 'Desactivado (Cuadrícula Estándar)', fr: 'Désactivé (Grille Standard)' } }
