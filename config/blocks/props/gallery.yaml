tabs:
  layout:
    title:
      en: "Gallery Layout"
      tr: "Galeri Düzeni"
    fields:
      columns_default:
        type: select
        label:
          en: "Columns (Mobile)"
          tr: "Mobil (< 768px)"
        default: "1"
        col_span: 4
        options:
          - value: "1"
            label: "1"
          - value: "2"
            label: "2"
          - value: "3"
            label: "3"
          - value: "4"
            label: "4"
          - value: "5"
            label: "5"
          - value: "6"
            label: "6"
      columns_md:
        type: select
        label:
          en: "Columns (Tablet)"
          tr: "Tablet (>= 768px)"
        default: "3"
        col_span: 4
        options:
          - value: ""
            label:
              en: "Inherit (Devral)"
              tr: "Devral"
          - value: "1"
            label: "1"
          - value: "2"
            label: "2"
          - value: "3"
            label: "3"
          - value: "4"
            label: "4"
          - value: "5"
            label: "5"
          - value: "6"
            label: "6"
      columns_lg:
        type: select
        label:
          en: "Columns (Desktop)"
          tr: "Masaüstü (>= 1024px)"
        default: ""
        col_span: 4
        options:
          - value: ""
            label:
              en: "Inherit (Devral)"
              tr: "Devral"
          - value: "1"
            label: "1"
          - value: "2"
            label: "2"
          - value: "3"
            label: "3"
          - value: "4"
            label: "4"
          - value: "5"
            label: "5"
          - value: "6"
            label: "6"
      gap:
        type: select
        label:
          en: "Gallery Gap"
          tr: "Galeri Boşluğu"
        default: "md"
        col_span: 6
        options:
          - value: "collapse"
            label:
              en: "None (Collapse)"
              tr: "Yok (Bitişik)"
          - value: "sm"
            label:
              en: "Small (1rem / 16px)"
              tr: "Küçük (1rem / 16px)"
          - value: "md"
            label:
              en: "Medium (1.5rem / 24px)"
              tr: "Orta (1.5rem / 24px)"
          - value: "lg"
            label:
              en: "Large (2rem / 32px)"
              tr: "Büyük (2rem / 32px)"
          - value: "xl"
            label:
              en: "Extra Large (3rem / 48px)"
              tr: "Çok Büyük (3rem / 48px)"
      masonry:
        type: select
        label:
          en: "Masonry Layout"
          tr: "Duvar (Masonry) Düzeni"
        default: "none"
        col_span: 6
        options:
          - value: "none"
            label:
              en: "Disabled (Standard Grid)"
              tr: "Kapalı (Standart Izgara)"
          - value: "columns"
            label:
              en: "Columns Masonry"
              tr: "Sütun Tabanlı Duvar"
  overlay_defaults:
    title:
      en: "Overlay Defaults"
      tr: "Varsayılan Katman Ayarları"
    fields:
      overlay_position:
        type: select
        label:
          en: "Overlay Content Position"
          tr: "Katman Konumu"
        default: "bottom"
        col_span: 6
        options:
          - value: "bottom"
            label:
              en: "Bottom"
              tr: "Alt"
          - value: "center"
            label:
              en: "Center"
              tr: "Ortalı"
          - value: "top"
            label:
              en: "Top"
              tr: "Üst"
          - value: "cover"
            label:
              en: "Full Cover"
              tr: "Tüm Yüzey (Cover)"
      overlay_style:
        type: select
        label:
          en: "Overlay Style"
          tr: "Katman Stili"
        default: "gradient"
        col_span: 6
        options:
          - value: "gradient"
            label:
              en: "Dark Gradient"
              tr: "Koyu Degrade"
          - value: "dark"
            label:
              en: "Dark Backdrop"
              tr: "Koyu Zemin"
          - value: "light"
            label:
              en: "Light Backdrop"
              tr: "Açık Zemin"
          - value: "primary"
            label:
              en: "Primary Tint"
              tr: "Birincil Renk (Primary)"
      overlay_transition:
        type: select
        label:
          en: "Overlay Transition"
          tr: "Katman Geçiş Animasyonu"
        default: "fade"
        col_span: 6
        options:
          - value: "fade"
            label:
              en: "Fade"
              tr: "Belirme (Fade)"
          - value: "slide_top"
            label:
              en: "Slide from Top"
              tr: "Yukarıdan Kayma"
          - value: "slide_bottom"
            label:
              en: "Slide from Bottom"
              tr: "Aşağıdan Kayma"
          - value: "zoom_in"
            label:
              en: "Zoom In"
              tr: "Yakınlaşma (Zoom In)"
      image_transition:
        type: select
        label:
          en: "Image Hover Effect"
          tr: "Görsel Üzerine Gelme Etkisi"
        default: "zoom"
        col_span: 6
        options:
          - value: "zoom"
            label:
              en: "Zoom In (Scale)"
              tr: "Yakınlaş (Scale)"
          - value: "none"
            label:
              en: "None"
              tr: "Yok"
      media_aspect_ratio:
        type: select
        label:
          en: "Media Aspect Ratio"
          tr: "Görsel En-Boy Oranı"
        default: "4/3"
        col_span: 6
        options:
          - value: "1/1"
            label: "Square (1:1)"
          - value: "4/3"
            label: "Standard (4:3)"
          - value: "16/9"
            label: "Widescreen (16:9)"
          - value: "21/9"
            label: "Ultrawide (21:9)"
          - value: "auto"
            label: "Natural (Auto)"
      rounded:
        type: select
        label:
          en: "Corner Rounding"
          tr: "Köşe Yuvarlama"
        default: "xl"
        col_span: 6
        options:
          - value: "none"
            label: "None"
          - value: "sm"
            label: "Small"
          - value: "md"
            label: "Medium"
          - value: "lg"
            label: "Large"
          - value: "xl"
            label: "Extra Large (Rounded-xl)"
          - value: "2xl"
            label: "2XL"
          - value: "3xl"
            label: "3XL"
  lightbox:
    title:
      en: "Lightbox & Zoom"
      tr: "Büyük Görsel (Lightbox)"
    fields:
      lightbox:
        type: checkbox
        label:
          en: "Enable Modal Lightbox"
          tr: "Büyük Görsel Penceresini Etkinleştir"
        default: true
        col_span: 12
  filter:
    title:
      en: "Filter Navigation"
      tr: "Kategori Filtresi"
    fields:
      filter:
        type: checkbox
        label:
          en: "Enable Filter"
          tr: "Filtreyi Etkinleştir"
        default: false
        col_span: 6
      filter_style:
        type: select
        label:
          en: "Filter Style"
          tr: "Filtre Stili"
        default: "pills"
        col_span: 6
        options:
          - value: "pills"
            label:
              en: "Pills (Preline Soft)"
              tr: "Kapsül Butonlar"
          - value: "tabs"
            label:
              en: "Underline Tabs"
              tr: "Alt Çizgili Sekmeler"
          - value: "buttons"
            label:
              en: "Outline Buttons"
              tr: "Çizgili Butonlar"
      filter_align:
        type: select
        label:
          en: "Filter Alignment"
          tr: "Filtre Hizalaması"
        default: "center"
        col_span: 6
        options:
          - value: "left"
            label:
              en: "Left"
              tr: "Sola"
          - value: "center"
            label:
              en: "Center"
              tr: "Ortalı"
          - value: "right"
            label:
              en: "Right"
              tr: "Sağa"
      filter_all_label:
        type: text_line
        label:
          en: "All Items Button Label"
          tr: "Tümü Butonu Etiketi"
        default: "All"
        col_span: 6
  spacing:
    title:
      en: "Spacing & Advanced"
      tr: "Boşluklar ve Gelişmiş"
    fields:
      margin_top:
        type: select
        label:
          en: "Margin Top"
          tr: "Üst Boşluk"
        default: "default"
        col_span: 6
        options:
          - value: "none"
            label: "None"
          - value: "xs"
            label: "XS"
          - value: "sm"
            label: "SM"
          - value: "default"
            label: "Default"
          - value: "lg"
            label: "LG"
          - value: "xl"
            label: "XL"
      margin_bottom:
        type: select
        label:
          en: "Margin Bottom"
          tr: "Alt Boşluk"
        default: "default"
        col_span: 6
        options:
          - value: "none"
            label: "None"
          - value: "xs"
            label: "XS"
          - value: "sm"
            label: "SM"
          - value: "default"
            label: "Default"
          - value: "lg"
            label: "LG"
          - value: "xl"
            label: "XL"
      id:
        type: text_line
        label:
          en: "HTML ID Attribute"
          tr: "HTML ID Özelliği"
        col_span: 6
      custom_class:
        type: text_line
        label:
          en: "Custom CSS Classes"
          tr: "Özel CSS Sınıfları"
        col_span: 6
