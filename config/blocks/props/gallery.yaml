          - { value: xl, label: { en: 'Extra Large (3rem / 48px)', tr: 'Çok Büyük (3rem / 48px)', de: 'Extra Groß (3rem / 48px)', ru: 'Очень большой (3rem / 48px)', es: 'Extra Grande (3rem / 48px)', fr: 'Très Grand (3rem / 48px)' } }
