        type: checkbox
        label:
          en: 'Enable Modal Lightbox'
          tr: 'Büyük Görsel Penceresini Etkinleştir'
          de: 'Modal-Lightbox aktivieren'
          ru: 'Включить лайтбокс'
          es: 'Activar Lightbox Modal'
          fr: 'Activer la Lightbox Modale'
        default: true
        col_span: 12
      filter:
        type: checkbox
        label:
          en: 'Enable Filter'
          tr: 'Filtreyi Etkinleştir'
          de: 'Filter aktivieren'
          ru: 'Включить фильтр'
          es: 'Activar Filtro'
          fr: 'Activer le Filtre'
        default: false
        col_span: 6
