          - { value: 16/9, label: { en: 'Widescreen (16:9)', tr: 'Geniş Ekran (16:9)', de: 'Breitbild (16:9)', ru: 'Широкоэкранный (16:9)', es: 'Panorámico (16:9)', fr: 'Écran Large (16:9)' } }
          - { value: 21/9, label: { en: 'Ultrawide (21:9)', tr: 'Ultra Geniş (21:9)', de: 'Ultrabreit (21:9)', ru: 'Ультраширокий (21:9)', es: 'Ultra Panorámico (21:9)', fr: 'Ultra Large (21:9)' } }
          - { value: auto, label: { en: 'Natural (Auto)', tr: 'Doğal (Otomatik)', de: 'Natürlich (Auto)', ru: 'Естественный (Авто)', es: 'Natural (Auto)', fr: 'Naturel (Auto)' } }
