          tr: 'Katman Stili'
          de: Overlay-Stil
          ru: 'Стиль наложения'
          es: 'Estilo de Superposición'
          fr: 'Style de Superposition'
        default: gradient
        col_span: 6
        options:
          - { value: gradient, label: { en: 'Dark Gradient', tr: 'Koyu Degrade', de: 'Dunkler Verlauf', ru: 'Тёмный градиент', es: 'Degradado Oscuro', fr: 'Dégradé Sombre' } }
          - { value: dark, label: { en: 'Dark Backdrop', tr: 'Koyu Zemin', de: 'Dunkler Hintergrund', ru: 'Тёмный фон', es: 'Fondo Oscuro', fr: 'Arrière-plan Sombre' } }
          - { value: light, label: { en: 'Light Backdrop', tr: 'Açık Zemin', de: 'Heller Hintergrund', ru: 'Светлый фон', es: 'Fondo Claro', fr: 'Arrière-plan Clair' } }
