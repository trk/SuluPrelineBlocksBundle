tabs:
  settings:
    title:
      en: Settings
      tr: Ayarlar
      de: Einstellungen
      ru: Настройки
      es: Ajustes
      fr: Paramètres
    fields:
      header_layout:
        type: select
        label:
          en: 'Layout Style'
          tr: 'Düzen Stili'
          de: Layout-Stil
          ru: 'Стиль макета'
          es: 'Estilo de Diseño'
          fr: 'Style de Disposition'
        default: standard
        col_span: 6
        options:
          - { value: standard, label: { en: 'Standard', tr: 'Standart', de: 'Standard', ru: 'Стандартный', es: 'Estándar', fr: 'Standard' } }
          - { value: split, label: { en: 'Split', tr: 'İki Sütunlu', de: 'Geteilt', ru: 'Разделённый', es: 'Dividido', fr: 'Divisé' } }
          - { value: minimal, label: { en: 'Minimal', tr: 'Minimal', de: 'Minimal', ru: 'Минималистичный', es: 'Minimalista', fr: 'Minimal' } }
      show_breadcrumbs:
        type: checkbox
        label:
          en: 'Show Breadcrumbs'
          tr: 'Sayfa Yolunu Göster'
          de: 'Brotkrümelnavigation anzeigen'
          ru: 'Показать хлебные крошки'
          es: 'Mostrar Migas de Pan'
          fr: "Afficher le Fil d'Ariane"
        default: true
        col_span: 6
      padding_y:
        type: select
        label:
          en: 'Vertical Padding'
          tr: 'Dikey İç Boşluk'
          de: 'Vertikaler Innenabstand'
          ru: 'Вертикальный внутренний отступ'
          es: 'Relleno Vertical'
          fr: 'Marge Intérieure Verticale'
        default: default
        col_span: 6
        options:
          - { value: default, label: { en: Default, tr: Standart, de: Standard, ru: 'По умолчанию', es: Predeterminado, fr: 'Par Défaut' } }
          - { value: sm, label: { en: 'Small', tr: 'Küçük', de: 'Klein', ru: 'Малый', es: 'Pequeño', fr: 'Petit' } }
          - { value: lg, label: { en: 'Large', tr: 'Büyük', de: 'Groß', ru: 'Большой', es: 'Grande', fr: 'Grand' } }
          - { value: xl, label: { en: 'Extra Large', tr: 'Çok Büyük', de: 'Extra Groß', ru: 'Очень большой', es: 'Extra Grande', fr: 'Très Grand' } }
