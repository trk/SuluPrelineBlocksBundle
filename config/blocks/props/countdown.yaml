tabs:
  style:
    title:
      en: "Style & Behavior"
      tr: "Stil ve Davranış"
    fields:
      countdown_style:
        type: select
        label:
          en: "Card Style"
          tr: "Kart Stili"
        default: "boxed"
        col_span: 6
        options:
          - value: "boxed"
            label:
              en: "Boxed Cards"
              tr: "Kutulu Kartlar"
          - value: "minimal"
            label:
              en: "Minimal (No Card)"
              tr: "Minimal (Kutusuz)"
          - value: "pill"
            label:
              en: "Soft Pill"
              tr: "Yumuşak Kapsül"
      size:
        type: select
        label:
          en: "Size"
          tr: "Boyut"
        default: "md"
        col_span: 6
        options:
          - value: "sm"
            label:
              en: "Small"
              tr: "Küçük"
          - value: "md"
            label:
              en: "Medium"
              tr: "Orta"
          - value: "lg"
            label:
              en: "Large"
              tr: "Büyük"
          - value: "xl"
            label:
              en: "Extra Large"
              tr: "Çok Büyük"
      color:
        type: select
        label:
          en: "Number Color"
          tr: "Rakam Rengi"
        default: "default"
        col_span: 6
        options:
          - value: "default"
            label:
              en: "Default"
              tr: "Varsayılan"
          - value: "primary"
            label:
              en: "Primary Blue"
              tr: "Birincil Mavi"
          - value: "white"
            label:
              en: "White"
              tr: "Beyaz"
          - value: "dark"
            label:
              en: "Dark"
              tr: "Koyu"
      align:
        type: select
        label:
          en: "Alignment"
          tr: "Hizalama"
        default: "center"
        col_span: 6
        options:
          - value: "center"
            label:
              en: "Center"
              tr: "Ortalı"
          - value: "left"
            label:
              en: "Left"
              tr: "Sola"
          - value: "right"
            label:
              en: "Right"
              tr: "Sağa"
      show_label:
        type: checkbox
        label:
          en: "Show Labels (Days, Hours, ...)"
          tr: "Etiketleri Göster (Gün, Saat, ...)"
        default: true
        col_span: 6
      show_separator:
        type: checkbox
        label:
          en: "Show Separators (:)"
          tr: "Ayraçları Göster (:)"
        default: true
        col_span: 6
      on_expire:
        type: select
        label:
          en: "On Expire Action"
          tr: "Süre Dolduğunda"
        default: "message"
        col_span: 6
        options:
          - value: "message"
            label:
              en: "Show Message"
              tr: "Mesaj Göster"
          - value: "hide"
            label:
              en: "Hide Countdown"
              tr: "Geri Sayımı Gizle"
          - value: "reload"
            label:
              en: "Reload Page"
              tr: "Sayfayı Yenile"
      expire_message:
        type: text_line
        label:
          en: "Expired Message"
          tr: "Süre Doldu Mesajı"
        default: "Süre doldu!"
        col_span: 6
