tabs:
  settings:
    title:
      en: Settings
      tr: Ayarlar
      de: Einstellungen
      ru: Настройки
      es: Ajustes
      fr: Paramètres
    fields:
      style:
        type: select
        label:
          en: 'Row Style'
          tr: 'Satır Stili'
          de: Zeilenstil
          ru: 'Стиль строки'
          es: 'Estilo de Fila'
          fr: 'Style de Ligne'
        default: default
        col_span: 6
        options:
          - { value: default, label: { en: 'Clean', tr: 'Sade', de: 'Schlicht', ru: 'Чистый', es: 'Limpio', fr: 'Épuré' } }
          - { value: striped, label: { en: 'Striped & Hoverable', tr: 'Şeritli ve Vurgulu', de: 'Gestreift & Hover-Effekt', ru: 'Полосатые с подсветкой', es: 'Rayado y con Efecto Hover', fr: 'Rayé et Survolable' } }
          - { value: hover, label: { en: 'Hoverable Rows', tr: 'Üzerine Gelince Vurgulu', de: 'Zeilen mit Hover-Effekt', ru: 'Подсветка строк при наведении', es: 'Filas con Efecto Hover', fr: 'Lignes Survolables' } }
      size:
        type: select
        label:
          en: 'Cell Density'
          tr: 'Hücre Boyutu / Yoğunluğu'
          de: Zellendichte
          ru: 'Плотность ячеек'
          es: 'Densidad de Celdas'
          fr: 'Densité des Cellules'
        default: md
        col_span: 6
        options:
          - { value: sm, label: { en: 'Compact', tr: 'Dar', de: 'Kompakt', ru: 'Компактный', es: 'Compacto', fr: 'Compact' } }
          - { value: md, label: { en: 'Standard', tr: 'Standart', de: 'Standard', ru: 'Стандартный', es: 'Estándar', fr: 'Standard' } }
          - { value: lg, label: { en: 'Spacious', tr: 'Geniş', de: 'Geräumig', ru: 'Просторный', es: 'Espacioso', fr: 'Spacieux' } }
      bordered:
        type: checkbox
        label:
          en: 'Outer Card Border'
          tr: 'Dış Çerçeve'
          de: 'Äußerer Kartenrahmen'
          ru: 'Внешняя рамка карточки'
          es: 'Borde Exterior de Tarjeta'
          fr: 'Bordure Extérieure'
        default: false
        col_span: 6
      sticky_header:
        type: checkbox
        label:
          en: 'Sticky Table Header'
          tr: 'Sabit Tablo Başlığı'
          de: 'Fixierter Tabellenkopf'
          ru: 'Закреплённая шапка таблицы'
          es: 'Encabezado de Tabla Fijo'
          fr: 'En-tête de Tableau Épinglé'
        default: false
        col_span: 6
