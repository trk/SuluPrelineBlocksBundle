tabs:
  settings:
    title:
      en: Settings
      tr: Ayarlar
      de: Einstellungen
      ru: Настройки
      es: Ajustes
      fr: Paramètres
    fields:
      layout:
        type: select
        label:
          en: 'Grid Columns Layout'
          tr: 'Izgara Sütun Düzeni'
          de: Raster-Spaltenlayout
          ru: 'Схема колонок сетки'
          es: 'Diseño de Columnas de Cuadrícula'
          fr: 'Disposition des Colonnes de Grille'
        default: halves
        col_span: 6
        options:
          - { value: 12-col, label: { en: '12-Column Flexible Grid', tr: '12 Sütunlu Esnek Izgara', de: 'Flexibles 12-Spalten-Raster', ru: 'Гибкая 12-колоночная сетка', es: 'Cuadrícula Flexible de 12 Columnas', fr: 'Grille Flexible 12 Colonnes' } }
          - { value: halves, label: { en: '2 Columns - Halves', tr: '2 Sütun - Yarı Yarıya', de: '2 Spalten - Hälften', ru: '2 колонки - Пополам', es: '2 Columnas - Mitades', fr: '2 Colonnes - Moitiés' } }
          - { value: thirds, label: { en: '3 Columns - Thirds', tr: '3 Sütun - Üçte Bir', de: '3 Spalten - Drittel', ru: '3 колонки - По трети', es: '3 Columnas - Tercios', fr: '3 Colonnes - Tiers' } }
          - { value: quarters, label: { en: '4 Columns - Quarters', tr: '4 Sütun - Dörtte Bir', de: '4 Spalten - Viertel', ru: '4 колонки - По четверти', es: '4 Columnas - Cuartos', fr: '4 Colonnes - Quarts' } }
          - { value: sixths, label: { en: '6 Columns - Sixths', tr: '6 Sütun - Altıda Bir', de: '6 Spalten - Sechstel', ru: '6 колонок - По одной шестой', es: '6 Columnas - Sextos', fr: '6 Colonnes - Sixièmes' } }
          - { value: thirds-2-1, label: { en: 'Thirds 2-1', tr: 'Üçte İki - Üçte Bir', de: 'Drittel 2-1', ru: 'Две трети и треть', es: 'Tercios 2-1', fr: 'Tiers 2-1' } }
          - { value: thirds-1-2, label: { en: 'Thirds 1-2', tr: 'Üçte Bir - Üçte İki', de: 'Drittel 1-2', ru: 'Треть и две трети', es: 'Tercios 1-2', fr: 'Tiers 1-2' } }
          - { value: quarters-3-1, label: { en: 'Quarters 3-1', tr: 'Dörtte Üç - Dörtte Bir', de: 'Viertel 3-1', ru: 'Три четверти и четверть', es: 'Cuartos 3-1', fr: 'Quarts 3-1' } }
          - { value: quarters-1-3, label: { en: 'Quarters 1-3', tr: 'Dörtte Bir - Dörtte Üç', de: 'Viertel 1-3', ru: 'Четверть и три четверти', es: 'Cuartos 1-3', fr: 'Quarts 1-3' } }
          - { value: auto, label: { en: 'Auto Columns', tr: 'Otomatik Sütunlar', de: 'Automatische Spalten', ru: 'Автоматические колонки', es: 'Columnas Automáticas', fr: 'Colonnes Automatiques' } }
      gap:
        type: select
        label:
          en: 'Grid Gap'
          tr: 'Sütunlar Arası Boşluk'
          de: 'Rasterabstand'
          ru: 'Отступ сетки'
          es: 'Espaciado de Cuadrícula'
          fr: 'Espacement de Grille'
        default: md
        col_span: 6
        options:
          - { value: none, label: { en: 'None', tr: 'Yok', de: 'Keine', ru: 'Нет', es: 'Ninguno', fr: 'Aucun' } }
          - { value: xs, label: { en: 'Extra Small', tr: 'Çok Küçük', de: 'Extra Klein', ru: 'Очень малый', es: 'Extra Pequeño', fr: 'Très Petit' } }
          - { value: sm, label: { en: 'Small', tr: 'Küçük', de: 'Klein', ru: 'Малый', es: 'Pequeño', fr: 'Petit' } }
          - { value: md, label: { en: 'Medium / Default', tr: 'Orta / Standart', de: 'Mittel / Standard', ru: 'Средний / По умолчанию', es: 'Mediano / Predeterminado', fr: 'Moyen / Par Défaut' } }
          - { value: lg, label: { en: 'Large', tr: 'Büyük', de: 'Groß', ru: 'Большой', es: 'Grande', fr: 'Grand' } }
          - { value: xl, label: { en: 'Extra Large', tr: 'Çok Büyük', de: 'Extra Groß', ru: 'Очень большой', es: 'Extra Grande', fr: 'Très Grand' } }
      align_items:
        type: select
        label:
          en: 'Vertical Item Alignment'
          tr: 'Dikey Hizalama'
          de: 'Vertikale Elementausrichtung'
          ru: 'Вертикальное выравнивание элементов'
          es: 'Alineación Vertical de Elementos'
          fr: 'Alignement Vertical des Éléments'
        default: stretch
        col_span: 6
        options:
          - { value: stretch, label: { en: 'Stretch', tr: 'Uzat', de: 'Strecken', ru: 'Растянуть', es: 'Estirar', fr: 'Étirer' } }
          - { value: start, label: { en: 'Top / Start', tr: 'Üste Hizala', de: 'Oben / Start', ru: 'По верхнему краю', es: 'Arriba / Inicio', fr: 'Haut / Début' } }
          - { value: center, label: { en: 'Center', tr: Ortala, de: 'Zentriert', ru: 'По центру', es: 'Centro', fr: 'Centre' } }
          - { value: end, label: { en: 'Bottom / End', tr: 'Alta Hizala', de: 'Unten / Ende', ru: 'По нижнему краю', es: 'Abajo / Fin', fr: 'Bas / Fin' } }
      has_divider:
        type: checkbox
        label:
          en: 'Column Dividers'
          tr: 'Sütunlar Arası Ayırıcı Çizgi'
          de: Spaltentrennlinien
          ru: 'Разделители колонок'
          es: 'Divisores de Columna'
          fr: 'Séparateurs de Colonnes'
        default: false
        col_span: 6
