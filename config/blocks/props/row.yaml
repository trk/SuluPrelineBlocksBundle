tabs:
  settings:
    title:
      en: Settings
      tr: Ayarlar
      de: Einstellungen
      ru: Настройки
      es: Ajustes
      fr: Paramètres
    fields:
      layout:
        type: select
        label:
          en: 'Grid Columns Layout'
          tr: 'Izgara Sütun Düzeni'
          de: Raster-Spaltenlayout
          ru: 'Схема колонок сетки'
          es: 'Diseño de Columnas de Cuadrícula'
          fr: 'Disposition des Colonnes de Grille'
        default: halves
        col_span: 6
        options:
          - { value: 12-col, label: { en: '12-Column Flexible Grid', tr: '12 Sütunlu Esnek Izgara', de: 'Flexibles 12-Spalten-Raster', ru: 'Гибкая 12-колоночная сетка', es: 'Cuadrícula Flexible de 12 Columnas', fr: 'Grille Flexible 12 Colonnes' } }
          - { value: halves, label: { en: '2 Columns - Halves (50% / 50%)', tr: '2 Sütun - Yarı Yarıya (%50 / %50)', de: '2 Spalten - Hälften (50% / 50%)', ru: '2 колонки - Пополам (50% / 50%)', es: '2 Columnas - Mitades (50% / 50%)', fr: '2 Colonnes - Moitiés (50% / 50%)' } }
          - { value: thirds, label: { en: '3 Columns - Thirds (33% each)', tr: '3 Sütun - Üçte Bir', de: '3 Spalten - Drittel (je 33%)', ru: '3 колонки - По трети (33%)', es: '3 Columnas - Tercios (33% c/u)', fr: '3 Colonnes - Tiers (33% chacun)' } }
          - { value: quarters, label: { en: '4 Columns - Quarters (25% each)', tr: '4 Sütun - Dörtte Bir', de: '4 Spalten - Viertel (je 25%)', ru: '4 колонки - По четверти (25%)', es: '4 Columnas - Cuartos (25% c/u)', fr: '4 Colonnes - Quarts (25% chacun)' } }
          - { value: sixths, label: { en: '6 Columns - Sixths (16.6% each)', tr: '6 Sütun - Altıda Bir', de: '6 Spalten - Sechstel (je 16.6%)', ru: '6 колонок - По одной шестой (16.6%)', es: '6 Columnas - Sextos (16.6% c/u)', fr: '6 Colonnes - Sixièmes (16.6% chacun)' } }
          - { value: thirds-2-1, label: { en: 'Thirds 2-1 (66% / 33%)', tr: 'Üçte İki - Üçte Bir (%66 / %33)', de: 'Drittel 2-1 (66% / 33%)', ru: 'Две трети и треть (66% / 33%)', es: 'Tercios 2-1 (66% / 33%)', fr: 'Tiers 2-1 (66% / 33%)' } }
          - { value: thirds-1-2, label: { en: 'Thirds 1-2 (33% / 66%)', tr: 'Üçte Bir - Üçte İki (%33 / %66)', de: 'Drittel 1-2 (33% / 66%)', ru: 'Треть и две трети (33% / 66%)', es: 'Tercios 1-2 (33% / 66%)', fr: 'Tiers 1-2 (33% / 66%)' } }
          - { value: quarters-3-1, label: { en: 'Quarters 3-1 (75% / 25%)', tr: 'Dörtte Üç - Dörtte Bir (%75 / %25)', de: 'Viertel 3-1 (75% / 25%)', ru: 'Три четверти и четверть (75% / 25%)', es: 'Cuartos 3-1 (75% / 25%)', fr: 'Quarts 3-1 (75% / 25%)' } }
          - { value: quarters-1-3, label: { en: 'Quarters 1-3 (25% / 75%)', tr: 'Dörtte Bir - Dörtte Üç (%25 / %75)', de: 'Viertel 1-3 (25% / 75%)', ru: 'Четверть и три четверти (25% / 75%)', es: 'Cuartos 1-3 (25% / 75%)', fr: 'Quarts 1-3 (25% / 75%)' } }
          - { value: auto, label: { en: 'Auto Columns', tr: 'Otomatik Sütunlar', de: 'Automatische Spalten', ru: 'Автоматические колонки', es: 'Columnas Automáticas', fr: 'Colonnes Automatiques' } }
      gap:
        type: select
        label:
          en: 'Grid Gap'
          tr: 'Sütunlar Arası Boşluk (Gap)'
          de: 'Rasterabstand (Gap)'
          ru: 'Отступ сетки (Gap)'
          es: 'Espaciado de Cuadrícula (Gap)'
          fr: 'Espacement de Grille (Gap)'
        default: md
        col_span: 6
        options:
          - { value: none, label: { en: 'None (gap-0)', tr: 'Yok (gap-0)', de: 'Keine (gap-0)', ru: 'Нет (gap-0)', es: 'Ninguno (gap-0)', fr: 'Aucun (gap-0)' } }
          - { value: xs, label: { en: 'Extra Small (gap-2 sm:gap-3)', tr: 'Çok Küçük (xs)', de: 'Extra Klein (gap-2 sm:gap-3)', ru: 'Очень малый (xs)', es: 'Extra Pequeño (xs)', fr: 'Très Petit (xs)' } }
          - { value: sm, label: { en: 'Small (gap-4 sm:gap-6)', tr: 'Küçük (sm)', de: 'Klein (gap-4 sm:gap-6)', ru: 'Малый (sm)', es: 'Pequeño (sm)', fr: 'Petit (sm)' } }
          - { value: md, label: { en: 'Medium / Default (gap-6 sm:gap-8)', tr: 'Orta / Standart (md)', de: 'Mittel / Standard (gap-6 sm:gap-8)', ru: 'Средний / По умолчанию (md)', es: 'Mediano / Predeterminado (md)', fr: 'Moyen / Par Défaut (md)' } }
          - { value: lg, label: { en: 'Large (gap-8 sm:gap-12)', tr: 'Büyük (lg)', de: 'Groß (gap-8 sm:gap-12)', ru: 'Большой (lg)', es: 'Grande (lg)', fr: 'Grand (lg)' } }
          - { value: xl, label: { en: 'Extra Large (gap-12 sm:gap-16)', tr: 'Çok Büyük (xl)', de: 'Extra Groß (gap-12 sm:gap-16)', ru: 'Очень большой (xl)', es: 'Extra Grande (xl)', fr: 'Très Grand (xl)' } }
      align_items:
        type: select
        label:
          en: 'Vertical Item Alignment'
          tr: 'Dikey Hizalama'
          de: 'Vertikale Elementausrichtung'
          ru: 'Вертикальное выравнивание элементов'
          es: 'Alineación Vertical de Elementos'
          fr: 'Alignement Vertical des Éléments'
        default: stretch
        col_span: 6
        options:
          - { value: stretch, label: { en: 'Stretch (Equal Height Columns)', tr: 'Uzat (Eşit Yükseklik)', de: 'Strecken (Gleiche Spaltenhöhe)', ru: 'Растянуть (Одинаковая высота колонок)', es: 'Estirar (Columnas de Igual Altura)', fr: 'Étirer (Colonnes de Même Hauteur)' } }
          - { value: start, label: { en: 'Top / Start', tr: 'Üste Hizala', de: 'Oben / Start', ru: 'По верхнему краю', es: 'Arriba / Inicio', fr: 'Haut / Début' } }
          - { value: center, label: { en: 'Center (Vertically Centered)', tr: Ortala, de: 'Zentriert (Vertikal)', ru: 'По центру (Вертикально)', es: 'Centro (Centrado Verticalmente)', fr: 'Centre (Centré Verticalement)' } }
          - { value: end, label: { en: 'Bottom / End', tr: 'Alta Hizala', de: 'Unten / Ende', ru: 'По нижнему краю', es: 'Abajo / Fin', fr: 'Bas / Fin' } }
      has_divider:
        type: checkbox
        label:
          en: 'Column Dividers'
          tr: 'Sütunlar Arası Ayırıcı Çizgi'
          de: Spaltentrennlinien
          ru: 'Разделители колонок'
          es: 'Divisores de Columna'
          fr: 'Séparateurs de Colonnes'
        default: false
        col_span: 6
