tabs:
  settings:
    title:
      en: Settings
      tr: Ayarlar
      de: Einstellungen
      ru: Настройки
      es: Ajustes
      fr: Paramètres
    fields:
      quote_style:
        type: select
        label:
          en: 'Quote Style'
          tr: 'Alıntı Stili'
          de: Zitat-Stil
          ru: 'Стиль цитаты'
          es: 'Estilo de Cita'
          fr: 'Style de Citation'
        default: bordered
        col_span: 6
        options:
          - { value: bordered, label: { en: 'Left Accent Line', tr: 'Sol Vurgu Çizgili', de: 'Linke Akzentlinie', ru: 'Акцентная линия слева', es: 'Línea de Acento Izquierda', fr: "Ligne d'Accent à Gauche" } }
          - { value: large, label: { en: 'Large Quote Mark', tr: 'Büyük Tırnak İşaretli', de: 'Großes Anführungszeichen', ru: 'Крупные кавычки', es: 'Comillas Grandes', fr: 'Grands Guillemets' } }
          - { value: card, label: { en: 'Testimonial Card', tr: 'Yorum / Görüş Kartı', de: Referenz-Karte, ru: 'Карточка отзыва', es: 'Tarjeta de Testimonio', fr: 'Carte de Témoignage' } }
          - { value: plain, label: { en: 'Plain Text', tr: 'Sade Metin', de: Klartext, ru: 'Обычный текст', es: 'Texto Plano', fr: 'Texte Brut' } }
      quote_size:
        type: select
        label:
          en: 'Font Size'
          tr: 'Yazı Boyutu'
          de: Schriftgröße
          ru: 'Размер шрифта'
          es: 'Tamaño de Fuente'
          fr: 'Taille de Police'
        default: md
        col_span: 6
        options:
          - { value: sm, label: { en: Small, tr: Küçük, de: 'Klein (sm)', ru: 'Малый (sm)', es: 'Pequeño (sm)', fr: 'Petit (sm)' } }
          - { value: md, label: { en: Medium, tr: Orta, de: 'Mittel (md)', ru: 'Средний (md)', es: 'Mediano (md)', fr: 'Moyen (md)' } }
          - { value: lg, label: { en: Large, tr: Büyük, de: 'Groß (lg)', ru: 'Большой (lg)', es: 'Grande (lg)', fr: 'Grand (lg)' } }
          - { value: xl, label: { en: 'Extra Large', tr: 'Çok Büyük', de: 'Extra Groß (xl)', ru: 'Очень большой (xl)', es: 'Extra Grande (xl)', fr: 'Très Grand (xl)' } }
      accent_color:
        type: select
        label:
          en: 'Accent Color'
          tr: 'Vurgu Rengi'
          de: Akzentfarbe
          ru: 'Акцентный цвет'
          es: 'Color de Acento'
          fr: "Couleur d'Accent"
        default: primary
        col_span: 6
        options:
          - { value: primary, label: { en: 'Primary Blue', tr: 'Birincil Mavi', de: Primärblau, ru: 'Основной синий', es: 'Azul Primario', fr: 'Bleu Primaire' } }
          - { value: dark, label: { en: Dark, tr: Koyu, de: Dunkel, ru: Тёмный, es: Oscuro, fr: Sombre } }
          - { value: muted, label: { en: 'Muted Gray', tr: 'Açık Gri', de: 'Gedämpftes Grau', ru: 'Приглушённый серый', es: 'Gris Atenuado', fr: 'Gris Atténué' } }
      align:
        type: select
        label:
          en: Alignment
          tr: Hizalama
          de: Ausrichtung
          ru: Выравнивание
          es: Alineación
          fr: Alignement
        default: left
        col_span: 6
        options:
          - { value: left, label: { en: Left, tr: Sola, de: Links, ru: Слева, es: Izquierda, fr: Gauche } }
          - { value: center, label: { en: Center, tr: Ortalı, de: Zentriert, ru: 'По центру', es: Centro, fr: Centre } }
          - { value: right, label: { en: Right, tr: Sağa, de: Rechts, ru: Справа, es: Derecha, fr: Droite } }
