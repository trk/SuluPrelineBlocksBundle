tabs:
  settings:
    title:
      en: Settings
      tr: Ayarlar
      de: Einstellungen
      ru: Настройки
      es: Ajustes
      fr: Paramètres
    fields:
      layout_type:
        type: select
        label:
          en: 'Layout Mode'
          tr: 'Düzen Modu'
          de: Layout-Modus
          ru: 'Режим компоновки'
          es: 'Modo de Diseño'
          fr: 'Mode de Disposition'
        default: grid
        col_span: 12
        options:
          - { value: grid, label: { en: 'Standard Grid', tr: 'Standart Izgara', de: Standard-Raster, ru: 'Стандартная сетка', es: 'Cuadrícula Estándar', fr: 'Grille Standard' } }
          - { value: masonry, label: { en: 'Masonry (Columns)', tr: 'Duvar Örgüsü (Masonry)', de: 'Masonry (Spalten)', ru: 'Кладка (Колонки)', es: 'Mosaico (Columnas)', fr: 'Maçonnerie (Colonnes)' } }
          - { value: card_group, label: { en: 'Card Group (Joined Cards)', tr: 'Kart Grubu (Birleşik Kartlar)', de: 'Kartengruppe (Verbunden)', ru: 'Группа карточек (Слитная)', es: 'Grupo de Tarjetas (Unidas)', fr: 'Groupe de Cartes (Jointes)' } }
      columns_default:
        type: select
        label:
          en: 'Columns (Mobile)'
          tr: 'Mobil (< 768px)'
          de: 'Spalten (Mobil)'
          ru: 'Колонки (Мобильные)'
          es: 'Columnas (Móvil)'
          fr: 'Colonnes (Mobile)'
        default: '1'
        col_span: 4
        options:
          - { value: '1', label: { en: '1', tr: '1', de: '1', ru: '1', es: '1', fr: '1' } }
          - { value: '2', label: { en: '2', tr: '2', de: '2', ru: '2', es: '2', fr: '2' } }
          - { value: '3', label: { en: '3', tr: '3', de: '3', ru: '3', es: '3', fr: '3' } }
          - { value: '4', label: { en: '4', tr: '4', de: '4', ru: '4', es: '4', fr: '4' } }
          - { value: '5', label: { en: '5', tr: '5', de: '5', ru: '5', es: '5', fr: '5' } }
          - { value: '6', label: { en: '6', tr: '6', de: '6', ru: '6', es: '6', fr: '6' } }
      columns_md:
        type: select
        label:
          en: 'Columns (Tablet)'
          tr: 'Tablet (>= 768px)'
          de: 'Spalten (Tablet)'
          ru: 'Колонки (Планшет)'
          es: 'Columnas (Tablet)'
          fr: 'Colonnes (Tablette)'
        default: '3'
        col_span: 4
        options:
          - { value: '', label: { en: 'Inherit (Devral)', tr: Devral, de: Übernehmen, ru: Наследовать, es: Heredar, fr: Hériter } }
          - { value: '1', label: { en: '1', tr: '1', de: '1', ru: '1', es: '1', fr: '1' } }
          - { value: '2', label: { en: '2', tr: '2', de: '2', ru: '2', es: '2', fr: '2' } }
          - { value: '3', label: { en: '3', tr: '3', de: '3', ru: '3', es: '3', fr: '3' } }
          - { value: '4', label: { en: '4', tr: '4', de: '4', ru: '4', es: '4', fr: '4' } }
          - { value: '5', label: { en: '5', tr: '5', de: '5', ru: '5', es: '5', fr: '5' } }
          - { value: '6', label: { en: '6', tr: '6', de: '6', ru: '6', es: '6', fr: '6' } }
      columns_lg:
        type: select
        label:
          en: 'Columns (Desktop)'
          tr: 'Masaüstü (>= 1024px)'
          de: 'Spalten (Desktop)'
          ru: 'Колонки (ПК)'
          es: 'Columnas (Escritorio)'
          fr: 'Colonnes (Bureau)'
        default: ''
        col_span: 4
        options:
          - { value: '', label: { en: 'Inherit (Devral)', tr: Devral, de: Übernehmen, ru: Наследовать, es: Heredar, fr: Hériter } }
          - { value: '1', label: { en: '1', tr: '1', de: '1', ru: '1', es: '1', fr: '1' } }
          - { value: '2', label: { en: '2', tr: '2', de: '2', ru: '2', es: '2', fr: '2' } }
          - { value: '3', label: { en: '3', tr: '3', de: '3', ru: '3', es: '3', fr: '3' } }
          - { value: '4', label: { en: '4', tr: '4', de: '4', ru: '4', es: '4', fr: '4' } }
          - { value: '5', label: { en: '5', tr: '5', de: '5', ru: '5', es: '5', fr: '5' } }
          - { value: '6', label: { en: '6', tr: '6', de: '6', ru: '6', es: '6', fr: '6' } }
      gap:
        type: select
        label:
          en: 'Grid Gap'
          tr: 'Izgara Boşluğu'
          de: 'Rasterabstand (Gap)'
          ru: 'Отступ сетки (Gap)'
          es: 'Espaciado de Cuadrícula (Gap)'
          fr: 'Espacement de Grille (Gap)'
        default: md
        col_span: 6
        options:
          - { value: collapse, label: { en: 'None (Collapse)', tr: 'Yok (Bitişik)', de: 'Keine (Ohne Abstand)', ru: 'Нет (Без отступов)', es: 'Ninguno (Sin Espacio)', fr: 'Aucun (Sans Espace)' } }
          - { value: sm, label: { en: 'Small (1rem / 16px)', tr: 'Küçük (1rem / 16px)', de: 'Klein (1rem / 16px)', ru: 'Малый (1rem / 16px)', es: 'Pequeño (1rem / 16px)', fr: 'Petit (1rem / 16px)' } }
          - { value: md, label: { en: 'Medium (1.5rem / 24px)', tr: 'Orta (1.5rem / 24px)', de: 'Mittel (1.5rem / 24px)', ru: 'Средний (1.5rem / 24px)', es: 'Mediano (1.5rem / 24px)', fr: 'Moyen (1.5rem / 24px)' } }
          - { value: lg, label: { en: 'Large (2rem / 32px)', tr: 'Büyük (2rem / 32px)', de: 'Groß (2rem / 32px)', ru: 'Большой (2rem / 32px)', es: 'Grande (2rem / 32px)', fr: 'Grand (2rem / 32px)' } }
          - { value: xl, label: { en: 'Extra Large (3rem / 48px)', tr: 'Çok Büyük (3rem / 48px)', de: 'Extra Groß (3rem / 48px)', ru: 'Очень большой (3rem / 48px)', es: 'Extra Grande (3rem / 48px)', fr: 'Très Grand (3rem / 48px)' } }
      masonry:
        type: select
        label:
          en: 'Masonry Layout'
          tr: 'Duvar (Masonry) Düzeni'
          de: Masonry-Layout
          ru: 'Каменная кладка (Masonry)'
          es: 'Diseño Mosaico (Masonry)'
          fr: 'Disposition Maçonnerie (Masonry)'
        default: none
        col_span: 6
        options:
          - { value: none, label: { en: 'Disabled (Standard Grid)', tr: 'Kapalı (Standart Izgara)', de: 'Deaktiviert (Standard-Raster)', ru: 'Отключено (Стандартная сетка)', es: 'Desactivado (Cuadrícula Estándar)', fr: 'Désactivé (Grille Standard)' } }
          - { value: columns, label: { en: 'Columns Masonry', tr: 'Sütun Tabanlı Duvar', de: Spalten-Masonry, ru: 'Колоночная кладка', es: 'Mosaico por Columnas', fr: 'Maçonnerie en Colonnes' } }
      card_variant:
        type: select
        label:
          en: 'Default Card Variant'
          tr: 'Kart Varyantı'
          de: Standard-Kartenvariante
          ru: 'Вариант карточки по умолчанию'
          es: 'Variante de Tarjeta Predeterminada'
          fr: 'Variante de Carte par Défaut'
        default: default
        col_span: 6
        options:
          - { value: default, label: { en: Default, tr: Varsayılan, de: Standard, ru: 'По умолчанию', es: Predeterminado, fr: 'Par Défaut' } }
          - { value: bordered, label: { en: Bordered, tr: Kenarlıklı, de: Umrandet, ru: 'С рамкой', es: 'Con Borde', fr: Bordé } }
          - { value: flat, label: { en: 'Flat (Clean)', tr: 'Düz (Sade)', de: 'Flach (Schlicht)', ru: 'Плоский (Чистый)', es: 'Plano (Limpio)', fr: 'Plat (Épuré)' } }
          - { value: raised, label: { en: 'Raised (Shadow)', tr: 'Gölgeli (Raised)', de: 'Erhöht (Schatten)', ru: 'Приподнятый (С тенью)', es: 'Elevado (Con Sombra)', fr: 'Surélevé (Ombré)' } }
      media_align:
        type: select
        label:
          en: 'Media Alignment'
          tr: 'Medya Hizalaması'
          de: Medienausrichtung
          ru: 'Выравнивание медиа'
          es: 'Alineación Multimedia'
          fr: 'Alignement du Média'
        default: top
        col_span: 6
        options:
          - { value: top, label: { en: Top, tr: Üst, de: Oben, ru: Сверху, es: Arriba, fr: Haut } }
          - { value: bottom, label: { en: Bottom, tr: Alt, de: Unten, ru: Снизу, es: Abajo, fr: Bas } }
          - { value: left, label: { en: Left, tr: Sol, de: Links, ru: Слева, es: Izquierda, fr: Gauche } }
          - { value: right, label: { en: Right, tr: Sağ, de: Rechts, ru: Справа, es: Derecha, fr: Droite } }
      button_style:
        type: select
        label:
          en: 'Button / Link Style'
          tr: 'Buton Stili'
          de: 'Button- / Link-Stil'
          ru: 'Стиль кнопки / ссылки'
          es: 'Estilo de Botón / Enlace'
          fr: 'Style de Bouton / Lien'
        default: primary
        col_span: 6
        options:
          - { value: primary, label: { en: 'Primary Button', tr: 'Birincil Buton', de: 'Primärer Button', ru: 'Основная кнопка', es: 'Botón Primario', fr: 'Bouton Primaire' } }
          - { value: secondary, label: { en: 'Secondary Button', tr: 'İkincil Buton', de: 'Sekundärer Button', ru: 'Вторичная кнопка', es: 'Botón Secundario', fr: 'Bouton Secondaire' } }
          - { value: outline, label: { en: 'Outline Button', tr: 'Kenarlıklı Buton', de: 'Umrandeter Button', ru: 'Контурная кнопка', es: 'Botón con Contorno', fr: 'Bouton Contour' } }
          - { value: soft, label: { en: 'Soft Button', tr: 'Yumuşak Buton', de: 'Sanfter Button', ru: 'Мягкая кнопка', es: 'Botón Suave', fr: 'Bouton Doux' } }
          - { value: link, label: { en: 'Text Link', tr: 'Düz Link', de: Text-Link, ru: 'Текстовая ссылка', es: 'Enlace de Texto', fr: 'Lien Texte' } }
      filter:
        type: checkbox
        label:
          en: 'Enable Filter'
          tr: 'Filtreyi Etkinleştir'
          de: 'Filter aktivieren'
          ru: 'Включить фильтр'
          es: 'Activar Filtro'
          fr: 'Activer le Filtre'
        default: false
        col_span: 6
      filter_style:
        type: select
        label:
          en: 'Filter Style'
          tr: 'Filtre Stili'
          de: Filter-Stil
          ru: 'Стиль фильтра'
          es: 'Estilo de Filtro'
          fr: 'Style de Filtre'
        default: pills
        col_span: 6
        options:
          - { value: pills, label: { en: 'Pills (Preline Soft)', tr: 'Kapsül Butonlar', de: 'Pillen (Sanft)', ru: 'Капсулы (Мягкие)', es: 'Píldoras (Suaves)', fr: 'Pilules (Douces)' } }
          - { value: tabs, label: { en: 'Underline Tabs', tr: 'Alt Çizgili Sekmeler', de: 'Unterstrichene Tabs', ru: 'Подчёркнутые вкладки', es: 'Pestañas Subrayadas', fr: 'Onglets Soulignés' } }
          - { value: buttons, label: { en: 'Outline Buttons', tr: 'Çizgili Butonlar', de: 'Umrandete Buttons', ru: 'Контурные кнопки', es: 'Botones con Contorno', fr: 'Boutons avec Contour' } }
      filter_align:
        type: select
        label:
          en: 'Filter Alignment'
          tr: 'Filtre Hizalaması'
          de: Filter-Ausrichtung
          ru: 'Выравнивание фильтра'
          es: 'Alineación del Filtro'
          fr: 'Alignement du Filtre'
        default: center
        col_span: 6
        options:
          - { value: left, label: { en: Left, tr: Sola, de: Links, ru: Слева, es: Izquierda, fr: Gauche } }
          - { value: center, label: { en: Center, tr: Ortalı, de: Zentriert, ru: 'По центру', es: Centro, fr: Centre } }
          - { value: right, label: { en: Right, tr: Sağa, de: Rechts, ru: Справа, es: Derecha, fr: Droite } }
      filter_all_label:
        type: text_line
        label:
          en: 'All Items Button Label'
          tr: 'Tümü Butonu Etiketi'
          de: 'Beschriftung für „Alle Elemente“'
          ru: 'Текст кнопки «Все элементы»'
          es: 'Etiqueta del Botón Todos'
          fr: 'Libellé du Bouton Tout'
        default: All
        col_span: 6
