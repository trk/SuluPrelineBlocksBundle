tabs:
  settings:
    title:
      en: Settings
      tr: Ayarlar
      de: Einstellungen
      ru: Настройки
      es: Ajustes
      fr: Paramètres
    fields:
      layout_type:
        type: select
        label:
          en: 'Layout Mode'
          tr: 'Düzen Modu'
          de: Layout-Modus
          ru: 'Режим компоновки'
          es: 'Modo de Diseño'
          fr: 'Mode de Disposition'
        default: grid
        col_span: 12
        options:
          - { value: grid, label: { en: 'Standard Grid', tr: 'Standart Izgara', de: Standard-Raster, ru: 'Стандартная сетка', es: 'Cuadrícula Estándar', fr: 'Grille Standard' } }
          - { value: masonry, label: { en: 'Masonry', tr: 'Duvar Örgüsü', de: 'Masonry', ru: 'Кладка', es: 'Mosaico', fr: 'Maçonnerie' } }
          - { value: card_group, label: { en: 'Card Group', tr: 'Kart Grubu', de: 'Kartengruppe', ru: 'Группа карточек', es: 'Grupo de Tarjetas', fr: 'Groupe de Cartes' } }
      columns_default:
        type: select
        label:
          en: 'Columns'
          tr: 'Mobil'
          de: 'Spalten'
          ru: 'Колонки'
          es: 'Columnas'
          fr: 'Colonnes'
        default: '1'
        col_span: 4
        options:
          - { value: '1', label: { en: '1', tr: '1', de: '1', ru: '1', es: '1', fr: '1' } }
          - { value: '2', label: { en: '2', tr: '2', de: '2', ru: '2', es: '2', fr: '2' } }
          - { value: '3', label: { en: '3', tr: '3', de: '3', ru: '3', es: '3', fr: '3' } }
          - { value: '4', label: { en: '4', tr: '4', de: '4', ru: '4', es: '4', fr: '4' } }
          - { value: '5', label: { en: '5', tr: '5', de: '5', ru: '5', es: '5', fr: '5' } }
          - { value: '6', label: { en: '6', tr: '6', de: '6', ru: '6', es: '6', fr: '6' } }
      columns_md:
        type: select
        label:
          en: 'Columns'
          tr: 'Tablet'
          de: 'Spalten'
          ru: 'Колонки'
          es: 'Columnas'
          fr: 'Colonnes'
        default: '3'
        col_span: 4
        options:
          - { value: '', label: { en: 'Inherit', tr: Devral, de: Übernehmen, ru: Наследовать, es: Heredar, fr: Hériter } }
          - { value: '1', label: { en: '1', tr: '1', de: '1', ru: '1', es: '1', fr: '1' } }
          - { value: '2', label: { en: '2', tr: '2', de: '2', ru: '2', es: '2', fr: '2' } }
          - { value: '3', label: { en: '3', tr: '3', de: '3', ru: '3', es: '3', fr: '3' } }
          - { value: '4', label: { en: '4', tr: '4', de: '4', ru: '4', es: '4', fr: '4' } }
          - { value: '5', label: { en: '5', tr: '5', de: '5', ru: '5', es: '5', fr: '5' } }
          - { value: '6', label: { en: '6', tr: '6', de: '6', ru: '6', es: '6', fr: '6' } }
      columns_lg:
        type: select
        label:
          en: 'Columns'
          tr: 'Masaüstü'
          de: 'Spalten'
          ru: 'Колонки'
          es: 'Columnas'
          fr: 'Colonnes'
        default: ''
        col_span: 4
        options:
          - { value: '', label: { en: 'Inherit', tr: Devral, de: Übernehmen, ru: Наследовать, es: Heredar, fr: Hériter } }
          - { value: '1', label: { en: '1', tr: '1', de: '1', ru: '1', es: '1', fr: '1' } }
          - { value: '2', label: { en: '2', tr: '2', de: '2', ru: '2', es: '2', fr: '2' } }
          - { value: '3', label: { en: '3', tr: '3', de: '3', ru: '3', es: '3', fr: '3' } }
          - { value: '4', label: { en: '4', tr: '4', de: '4', ru: '4', es: '4', fr: '4' } }
          - { value: '5', label: { en: '5', tr: '5', de: '5', ru: '5', es: '5', fr: '5' } }
          - { value: '6', label: { en: '6', tr: '6', de: '6', ru: '6', es: '6', fr: '6' } }
      gap:
        type: select
        label:
          en: 'Grid Gap'
          tr: 'Izgara Boşluğu'
          de: 'Rasterabstand'
          ru: 'Отступ сетки'
          es: 'Espaciado de Cuadrícula'
          fr: 'Espacement de Grille'
        default: md
        col_span: 6
        options:
          - { value: collapse, label: { en: 'None', tr: 'Yok', de: 'Keine', ru: 'Нет', es: 'Ninguno', fr: 'Aucun' } }
          - { value: sm, label: { en: 'Small', tr: 'Küçük', de: 'Klein', ru: 'Малый', es: 'Pequeño', fr: 'Petit' } }
          - { value: md, label: { en: 'Medium', tr: 'Orta', de: 'Mittel', ru: 'Средний', es: 'Mediano', fr: 'Moyen' } }
          - { value: lg, label: { en: 'Large', tr: 'Büyük', de: 'Groß', ru: 'Большой', es: 'Grande', fr: 'Grand' } }
          - { value: xl, label: { en: 'Extra Large', tr: 'Çok Büyük', de: 'Extra Groß', ru: 'Очень большой', es: 'Extra Grande', fr: 'Très Grand' } }
      masonry:
        type: select
        label:
          en: 'Masonry Layout'
          tr: 'Duvar Düzeni'
          de: Masonry-Layout
          ru: 'Каменная кладка'
          es: 'Diseño Mosaico'
          fr: 'Disposition Maçonnerie'
        default: none
        col_span: 6
        options:
          - { value: none, label: { en: 'Disabled', tr: 'Kapalı', de: 'Deaktiviert', ru: 'Отключено', es: 'Desactivado', fr: 'Désactivé' } }
          - { value: columns, label: { en: 'Columns Masonry', tr: 'Sütun Tabanlı Duvar', de: Spalten-Masonry, ru: 'Колоночная кладка', es: 'Mosaico por Columnas', fr: 'Maçonnerie en Colonnes' } }
      card_variant:
        type: select
        label:
          en: 'Default Card Variant'
          tr: 'Kart Varyantı'
          de: Standard-Kartenvariante
          ru: 'Вариант карточки по умолчанию'
          es: 'Variante de Tarjeta Predeterminada'
          fr: 'Variante de Carte par Défaut'
        default: default
        col_span: 6
        options:
          - { value: default, label: { en: Default, tr: Varsayılan, de: Standard, ru: 'По умолчанию', es: Predeterminado, fr: 'Par Défaut' } }
          - { value: bordered, label: { en: Bordered, tr: Kenarlıklı, de: Umrandet, ru: 'С рамкой', es: 'Con Borde', fr: Bordé } }
          - { value: flat, label: { en: 'Flat', tr: 'Düz', de: 'Flach', ru: 'Плоский', es: 'Plano', fr: 'Plat' } }
          - { value: raised, label: { en: 'Raised', tr: 'Gölgeli', de: 'Erhöht', ru: 'Приподнятый', es: 'Elevado', fr: 'Surélevé' } }
      media_align:
        type: select
        label:
          en: 'Media Alignment'
          tr: 'Medya Hizalaması'
          de: Medienausrichtung
          ru: 'Выравнивание медиа'
          es: 'Alineación Multimedia'
          fr: 'Alignement du Média'
        default: top
        col_span: 6
        options:
          - { value: top, label: { en: Top, tr: Üst, de: Oben, ru: Сверху, es: Arriba, fr: Haut } }
          - { value: bottom, label: { en: Bottom, tr: Alt, de: Unten, ru: Снизу, es: Abajo, fr: Bas } }
          - { value: left, label: { en: Left, tr: Sol, de: Links, ru: Слева, es: Izquierda, fr: Gauche } }
          - { value: right, label: { en: Right, tr: Sağ, de: Rechts, ru: Справа, es: Derecha, fr: Droite } }
      button_style:
        type: select
        label:
          en: 'Button / Link Style'
          tr: 'Buton Stili'
          de: 'Button- / Link-Stil'
          ru: 'Стиль кнопки / ссылки'
          es: 'Estilo de Botón / Enlace'
          fr: 'Style de Bouton / Lien'
        default: primary
        col_span: 6
        options:
          - { value: primary, label: { en: 'Primary Button', tr: 'Birincil Buton', de: 'Primärer Button', ru: 'Основная кнопка', es: 'Botón Primario', fr: 'Bouton Primaire' } }
          - { value: secondary, label: { en: 'Secondary Button', tr: 'İkincil Buton', de: 'Sekundärer Button', ru: 'Вторичная кнопка', es: 'Botón Secundario', fr: 'Bouton Secondaire' } }
          - { value: outline, label: { en: 'Outline Button', tr: 'Kenarlıklı Buton', de: 'Umrandeter Button', ru: 'Контурная кнопка', es: 'Botón con Contorno', fr: 'Bouton Contour' } }
          - { value: soft, label: { en: 'Soft Button', tr: 'Yumuşak Buton', de: 'Sanfter Button', ru: 'Мягкая кнопка', es: 'Botón Suave', fr: 'Bouton Doux' } }
          - { value: link, label: { en: 'Text Link', tr: 'Düz Link', de: Text-Link, ru: 'Текстовая ссылка', es: 'Enlace de Texto', fr: 'Lien Texte' } }
      filter:
        type: checkbox
        label:
          en: 'Enable Filter'
          tr: 'Filtreyi Etkinleştir'
          de: 'Filter aktivieren'
          ru: 'Включить фильтр'
          es: 'Activar Filtro'
          fr: 'Activer le Filtre'
        default: false
        col_span: 6
      filter_style:
        type: select
        label:
          en: 'Filter Style'
          tr: 'Filtre Stili'
          de: Filter-Stil
          ru: 'Стиль фильтра'
          es: 'Estilo de Filtro'
          fr: 'Style de Filtre'
        default: pills
        col_span: 6
        options:
          - { value: pills, label: { en: 'Pills', tr: 'Kapsül Butonlar', de: 'Pillen', ru: 'Капсулы', es: 'Píldoras', fr: 'Pilules' } }
          - { value: tabs, label: { en: 'Underline Tabs', tr: 'Alt Çizgili Sekmeler', de: 'Unterstrichene Tabs', ru: 'Подчёркнутые вкладки', es: 'Pestañas Subrayadas', fr: 'Onglets Soulignés' } }
          - { value: buttons, label: { en: 'Outline Buttons', tr: 'Çizgili Butonlar', de: 'Umrandete Buttons', ru: 'Контурные кнопки', es: 'Botones con Contorno', fr: 'Boutons avec Contour' } }
      filter_align:
        type: select
        label:
          en: 'Filter Alignment'
          tr: 'Filtre Hizalaması'
          de: Filter-Ausrichtung
          ru: 'Выравнивание фильтра'
          es: 'Alineación del Filtro'
          fr: 'Alignement du Filtre'
        default: center
        col_span: 6
        options:
          - { value: left, label: { en: Left, tr: Sola, de: Links, ru: Слева, es: Izquierda, fr: Gauche } }
          - { value: center, label: { en: Center, tr: Ortalı, de: Zentriert, ru: 'По центру', es: Centro, fr: Centre } }
          - { value: right, label: { en: Right, tr: Sağa, de: Rechts, ru: Справа, es: Derecha, fr: Droite } }
      filter_all_label:
        type: text_line
        label:
          en: 'All Items Button Label'
          tr: 'Tümü Butonu Etiketi'
          de: 'Beschriftung für „Alle Elemente“'
          ru: 'Текст кнопки «Все элементы»'
          es: 'Etiqueta del Botón Todos'
          fr: 'Libellé du Bouton Tout'
        default: All
        col_span: 6
