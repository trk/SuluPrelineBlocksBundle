tabs:
  settings:
    title:
      en: Settings
      tr: Ayarlar
      de: Einstellungen
      ru: Настройки
      es: Ajustes
      fr: Paramètres
    fields:
      height:
        type: select
        label:
          en: 'Slideshow Height'
          tr: 'Slayt Yüksekliği'
          de: Diashow-Höhe
          ru: 'Высота слайд-шоу'
          es: 'Altura de Presentación'
          fr: 'Hauteur du Diaporama'
        default: medium
        col_span: 6
        options:
          - { value: small, label: { en: 'Small (300px - 380px)', tr: 'Küçük (300px - 380px)', de: 'Klein (300px - 380px)', ru: 'Малая (300px - 380px)', es: 'Pequeña (300px - 380px)', fr: 'Petite (300px - 380px)' } }
          - { value: medium, label: { en: 'Medium (420px - 500px)', tr: 'Standart (420px - 500px)', de: 'Mittel (420px - 500px)', ru: 'Средняя (420px - 500px)', es: 'Mediana (420px - 500px)', fr: 'Moyenne (420px - 500px)' } }
          - { value: large, label: { en: 'Large (550px - 650px)', tr: 'Büyük (550px - 650px)', de: 'Groß (550px - 650px)', ru: 'Большая (550px - 650px)', es: 'Grande (550px - 650px)', fr: 'Grande (550px - 650px)' } }
          - { value: full, label: { en: 'Full Viewport (100vh)', tr: 'Tam Ekran (100vh)', de: 'Vollbild (100vh)', ru: 'Во весь экран (100vh)', es: 'Pantalla Completa (100vh)', fr: 'Plein Écran (100vh)' } }
      content_align:
        type: select
        label:
          en: 'Caption Alignment'
          tr: 'Metin Hizalaması'
          de: Bildunterschrift-Ausrichtung
          ru: 'Выравнивание подписи'
          es: 'Alineación de Leyenda'
          fr: 'Alignement de la Légende'
        default: center
        col_span: 6
        options:
          - { value: left, label: { en: Left, tr: 'Sola Yaslı', de: Links, ru: Слева, es: Izquierda, fr: Gauche } }
          - { value: center, label: { en: Center, tr: Ortalı, de: Zentriert, ru: 'По центру', es: Centro, fr: Centre } }
          - { value: right, label: { en: Right, tr: 'Sağa Yaslı', de: Rechts, ru: Справа, es: Derecha, fr: Droite } }
      arrows:
        type: select
        label:
          en: 'Navigation Arrows'
          tr: 'Gezinti Okları'
          de: Navigationspfeile
          ru: 'Стрелки навигации'
          es: 'Flechas de Navegación'
          fr: 'Flèches de Navigation'
        default: inside
        col_span: 6
        options:
          - { value: inside, label: { en: Inside, tr: İçeride, de: Innen, ru: Внутри, es: Dentro, fr: "À l'Intérieur" } }
          - { value: outside, label: { en: Outside, tr: Dışarıda, de: Außen, ru: Снаружи, es: Fuera, fr: "À l'Extérieur" } }
          - { value: none, label: { en: Hidden, tr: Gizli, de: Ausgeblendet, ru: Скрыто, es: Oculto, fr: Masqué } }
      indicators:
        type: select
        label:
          en: 'Slide Indicators'
          tr: 'Sayfalama Göstergesi'
          de: Folienindikatoren
          ru: 'Индикаторы слайдов'
          es: 'Indicadores de Diapositiva'
          fr: 'Indicateurs de Diapositive'
        default: dots
        col_span: 6
        options:
          - { value: dots, label: { en: 'Pagination Dots', tr: 'Noktalar (Dots)', de: Seitenpunkte, ru: 'Точки пагинации', es: 'Puntos de Paginación', fr: 'Points de Pagination' } }
          - { value: none, label: { en: Hidden, tr: Gizli, de: Ausgeblendet, ru: Скрыто, es: Oculto, fr: Masqué } }
      autoplay:
        type: checkbox
        label:
          en: Autoplay
          tr: 'Otomatik Oynat'
          de: 'Automatische Wiedergabe'
          ru: Автовоспроизведение
          es: 'Reproducción Automática'
          fr: 'Lecture Automatique'
        default: true
        col_span: 4
      loop:
        type: checkbox
        label:
          en: 'Infinite Loop'
          tr: 'Sonsuz Döngü'
          de: Endlosschleife
          ru: 'Бесконечный цикл'
          es: 'Bucle Infinito'
          fr: 'Boucle Infinie'
        default: true
        col_span: 4
      interval:
        type: number
        label:
          en: 'Autoplay Interval (ms)'
          tr: 'Geçiş Süresi (ms)'
          de: 'Autoplay-Intervall (ms)'
          ru: 'Интервал автопрокрутки (мс)'
          es: 'Intervalo de Reproducción (ms)'
          fr: 'Intervalle de Lecture Auto (ms)'
        default: 5000
        col_span: 4
