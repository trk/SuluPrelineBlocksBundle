tabs:
  settings:
    title:
      en: Settings
      tr: Ayarlar
      de: Einstellungen
      ru: Настройки
      es: Ajustes
      fr: Paramètres
    fields:
      height:
        type: select
        label:
          en: 'Slideshow Height'
          tr: 'Slayt Yüksekliği'
          de: Diashow-Höhe
          ru: 'Высота слайд-шоу'
          es: 'Altura de Presentación'
          fr: 'Hauteur du Diaporama'
        default: medium
        col_span: 6
        options:
          - { value: small, label: { en: 'Small', tr: 'Küçük', de: 'Klein', ru: 'Малая', es: 'Pequeña', fr: 'Petite' } }
          - { value: medium, label: { en: 'Medium', tr: 'Standart', de: 'Mittel', ru: 'Средняя', es: 'Mediana', fr: 'Moyenne' } }
          - { value: large, label: { en: 'Large', tr: 'Büyük', de: 'Groß', ru: 'Большая', es: 'Grande', fr: 'Grande' } }
          - { value: full, label: { en: 'Full Viewport', tr: 'Tam Ekran', de: 'Vollbild', ru: 'Во весь экран', es: 'Pantalla Completa', fr: 'Plein Écran' } }
      content_align:
        type: select
        label:
          en: 'Caption Alignment'
          tr: 'Metin Hizalaması'
          de: Bildunterschrift-Ausrichtung
          ru: 'Выравнивание подписи'
          es: 'Alineación de Leyenda'
          fr: 'Alignement de la Légende'
        default: center
        col_span: 6
        options:
          - { value: left, label: { en: Left, tr: 'Sola Yaslı', de: Links, ru: Слева, es: Izquierda, fr: Gauche } }
          - { value: center, label: { en: Center, tr: Ortalı, de: Zentriert, ru: 'По центру', es: Centro, fr: Centre } }
          - { value: right, label: { en: Right, tr: 'Sağa Yaslı', de: Rechts, ru: Справа, es: Derecha, fr: Droite } }
      arrows:
        type: select
        label:
          en: 'Navigation Arrows'
          tr: 'Gezinti Okları'
          de: Navigationspfeile
          ru: 'Стрелки навигации'
          es: 'Flechas de Navegación'
          fr: 'Flèches de Navigation'
        default: inside
        col_span: 6
        options:
          - { value: inside, label: { en: Inside, tr: İçeride, de: Innen, ru: Внутри, es: Dentro, fr: "À l'Intérieur" } }
          - { value: outside, label: { en: Outside, tr: Dışarıda, de: Außen, ru: Снаружи, es: Fuera, fr: "À l'Extérieur" } }
          - { value: none, label: { en: Hidden, tr: Gizli, de: Ausgeblendet, ru: Скрыто, es: Oculto, fr: Masqué } }
      indicators:
        type: select
        label:
          en: 'Slide Indicators'
          tr: 'Sayfalama Göstergesi'
          de: Folienindikatoren
          ru: 'Индикаторы слайдов'
          es: 'Indicadores de Diapositiva'
          fr: 'Indicateurs de Diapositive'
        default: dots
        col_span: 6
        options:
          - { value: dots, label: { en: 'Pagination Dots', tr: 'Noktalar', de: Seitenpunkte, ru: 'Точки пагинации', es: 'Puntos de Paginación', fr: 'Points de Pagination' } }
          - { value: none, label: { en: Hidden, tr: Gizli, de: Ausgeblendet, ru: Скрыто, es: Oculto, fr: Masqué } }
      autoplay:
        type: checkbox
        label:
          en: Autoplay
          tr: 'Otomatik Oynat'
          de: 'Automatische Wiedergabe'
          ru: Автовоспроизведение
          es: 'Reproducción Automática'
          fr: 'Lecture Automatique'
        default: true
        col_span: 4
      loop:
        type: checkbox
        label:
          en: 'Infinite Loop'
          tr: 'Sonsuz Döngü'
          de: Endlosschleife
          ru: 'Бесконечный цикл'
          es: 'Bucle Infinito'
          fr: 'Boucle Infinie'
        default: true
        col_span: 4
      interval:
        type: number
        label:
          en: 'Autoplay Interval'
          tr: 'Geçiş Süresi'
          de: 'Autoplay-Intervall'
          ru: 'Интервал автопрокрутки'
          es: 'Intervalo de Reproducción'
          fr: 'Intervalle de Lecture Auto'
        default: 5000
        col_span: 4
