tabs:
  settings:
    title:
      en: Settings
      tr: Ayarlar
      de: Einstellungen
      ru: Настройки
      es: Ajustes
      fr: Paramètres
    fields:
      show_home:
        type: checkbox
        label:
          en: 'Include Home Link'
          tr: 'Ana Sayfa Bağlantısını Göster'
          de: 'Startseiten-Link einbinden'
          ru: 'Включить ссылку на главную'
          es: 'Incluir Enlace de Inicio'
          fr: "Inclure le Lien d'Accueil"
        default: true
        col_span: 6
      align:
        type: select
        label:
          en: Alignment
          tr: Hizalama
          de: Ausrichtung
          ru: Выравнивание
          es: Alineación
          fr: Alignement
        default: left
        col_span: 6
        options:
          - { value: left, label: { en: Left, tr: 'Sola Yaslı', de: Links, ru: Слева, es: Izquierda, fr: Gauche } }
          - { value: center, label: { en: Center, tr: Ortalı, de: Zentriert, ru: 'По центру', es: Centro, fr: Centre } }
          - { value: right, label: { en: Right, tr: 'Sağa Yaslı', de: Rechts, ru: Справа, es: Derecha, fr: Droite } }
      home_title:
        type: text
        label:
          en: 'Custom Home Label'
          tr: 'Özel Ana Sayfa Etiketi'
          de: 'Benutzerdefinierte Startseiten-Beschriftung'
          ru: 'Свой текст главной страницы'
          es: 'Etiqueta de Inicio Personalizada'
          fr: "Libellé d'Accueil Personnalisé"
        placeholder:
          en: Home
          tr: 'Ana Sayfa'
          de: Startseite
          ru: Главная
          es: Inicio
          fr: Accueil
        col_span: 6
      home_url:
        type: text
        label:
          en: 'Custom Home URL'
          tr: 'Özel Ana Sayfa Bağlantısı'
          de: 'Benutzerdefinierte Startseiten-URL'
          ru: 'Свой URL главной страницы'
          es: 'URL de Inicio Personalizada'
          fr: "URL d'Accueil Personnalisée"
        placeholder:
          en: /
          tr: /
          de: /
          ru: /
          es: /
          fr: /
        col_span: 6
