tabs:
  settings:
    title:
      en: Settings
      tr: Ayarlar
      de: Einstellungen
      ru: Настройки
      es: Ajustes
      fr: Paramètres
    fields:
      divider_style:
        type: select
        label:
          en: 'Divider Style'
          tr: 'Çizgi Stili'
          de: Trennlinien-Stil
          ru: 'Стиль разделителя'
          es: 'Estilo de Divisor'
          fr: 'Style de Séparateur'
        default: line
        col_span: 6
        options:
          - { value: line, label: { en: 'Solid Line', tr: 'Düz Çizgi', de: 'Durchgezogene Linie', ru: 'Сплошная линия', es: 'Línea Sólida', fr: 'Ligne Continue' } }
          - { value: dashed, label: { en: Dashed, tr: 'Kesikli Çizgi', de: Gestrichelt, ru: Пунктирная, es: Discontinua, fr: Tirets } }
          - { value: dotted, label: { en: Dotted, tr: 'Noktalı Çizgi', de: Gepunktet, ru: Точечная, es: Punteada, fr: Pointillés } }
          - { value: small, label: { en: 'Short Accent Bar', tr: 'Kısa Vurgu Çizgisi', de: 'Kurzer Akzentbalken', ru: 'Короткая акцентная полоса', es: 'Barra Corta de Acento', fr: "Barre d'Accent Courte" } }
          - { value: icon, label: { en: 'With Center Icon', tr: 'Ortasında İkonlu', de: 'Mit zentriertem Symbol', ru: 'С иконкой по центру', es: 'Con Icono Central', fr: 'Avec Icône Centrale' } }
      divider_color:
        type: select
        label:
          en: Color
          tr: Renk
          de: Farbe
          ru: Цвет
          es: Color
          fr: Couleur
        default: default
        col_span: 6
        options:
          - { value: default, label: { en: 'Neutral / Gray', tr: 'Standart / Gri', de: 'Neutral / Grau', ru: 'Нейтральный / Серый', es: 'Neutro / Gris', fr: 'Neutre / Gris' } }
          - { value: primary, label: { en: 'Primary Blue', tr: 'Birincil Mavi', de: Primärblau, ru: 'Основной синий', es: 'Azul Primario', fr: 'Bleu Primaire' } }
          - { value: muted, label: { en: 'Muted / Soft', tr: 'Açık / Yumuşak', de: 'Gedämpft / Sanft', ru: 'Приглушённый / Мягкий', es: 'Atenuado / Suave', fr: 'Atténué / Doux' } }
          - { value: dark, label: { en: Dark, tr: Koyu, de: Dunkel, ru: Тёмный, es: Oscuro, fr: Sombre } }
      divider_thickness:
        type: select
        label:
          en: Thickness
          tr: Kalınlık
          de: Stärke
          ru: Толщина
          es: Grosor
          fr: Épaisseur
        default: '1'
        col_span: 6
        options:
          - { value: '1', label: { en: 1px, tr: 1px, de: 1px, ru: 1px, es: 1px, fr: 1px } }
          - { value: '2', label: { en: 2px, tr: 2px, de: 2px, ru: 2px, es: 2px, fr: 2px } }
          - { value: '4', label: { en: 4px, tr: 4px, de: 4px, ru: 4px, es: 4px, fr: 4px } }
      divider_width:
        type: select
        label:
          en: Width
          tr: Genişlik
          de: Breite
          ru: Ширина
          es: Ancho
          fr: Largeur
        default: full
        col_span: 6
        options:
          - { value: full, label: { en: 'Full Width', tr: 'Tam Genişlik', de: 'Volle Breite', ru: 'Во всю ширину', es: 'Ancho Completo', fr: 'Pleine Largeur' } }
          - { value: 3-4, label: { en: 3/4, tr: 3/4, de: 3/4, ru: 3/4, es: 3/4, fr: 3/4 } }
          - { value: 1-2, label: { en: 1/2, tr: 1/2, de: 1/2, ru: 1/2, es: 1/2, fr: 1/2 } }
          - { value: 1-3, label: { en: 1/3, tr: 1/3, de: 1/3, ru: 1/3, es: 1/3, fr: 1/3 } }
          - { value: small, label: { en: 'Compact (64px)', tr: 'Küçük (64px)', de: 'Kompakt (64px)', ru: 'Компактный (64px)', es: 'Compacto (64px)', fr: 'Compact (64px)' } }
      divider_align:
        type: select
        label:
          en: Alignment
          tr: Hizalama
          de: Ausrichtung
          ru: Выравнивание
          es: Alineación
          fr: Alignement
        default: center
        col_span: 6
        options:
          - { value: center, label: { en: Center, tr: Ortalı, de: Zentriert, ru: 'По центру', es: Centro, fr: Centre } }
          - { value: left, label: { en: Left, tr: 'Sola Yaslı', de: Links, ru: Слева, es: Izquierda, fr: Gauche } }
          - { value: right, label: { en: Right, tr: 'Sağa Yaslı', de: Rechts, ru: Справа, es: Derecha, fr: Droite } }
