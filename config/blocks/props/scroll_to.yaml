tabs:
  settings:
    title:
      en: Settings
      tr: Ayarlar
      de: Einstellungen
      ru: Настройки
      es: Ajustes
      fr: Paramètres
    fields:
      display_mode:
        type: select
        label:
          en: 'Display Mode'
          tr: 'Görünüm Modu'
          de: Anzeigemodus
          ru: 'Режим отображения'
          es: 'Modo de Visualización'
          fr: "Mode d'Affichage"
        default: inline_button
        col_span: 6
        options:
          - { value: inline_button, label: { en: 'Standard Button', tr: 'Standart Buton', de: 'Standard-Button', ru: 'Стандартная кнопка', es: 'Botón Estándar', fr: 'Bouton Standard' } }
          - { value: totop_circle, label: { en: 'Classic Circle Icon Button', tr: 'Klasik Yuvarlak İkon Butonu', de: 'Klassischer runder Icon-Button', ru: 'Классическая круглая кнопка с иконкой', es: 'Botón Circular Clásico con Icono', fr: 'Bouton Icône Circulaire Classique' } }
          - { value: floating, label: { en: 'Floating Button', tr: 'Sabit Yüzen Buton', de: 'Schwebender Button', ru: 'Плавающая кнопка', es: 'Botón Flotante', fr: 'Bouton Flottant' } }
      button_variant:
        type: select
        label:
          en: 'Button Variant'
          tr: 'Buton Türü'
          de: Button-Variante
          ru: 'Вариант кнопки'
          es: 'Variante de Botón'
          fr: 'Variante de Bouton'
        default: solid
        col_span: 6
        options:
          - { value: solid, label: { en: 'Solid Background', tr: 'Dolu Arka Plan', de: 'Gefüllter Hintergrund', ru: 'Сплошной фон', es: 'Fondo Sólido', fr: 'Fond Plein' } }
          - { value: outline, label: { en: Outlined, tr: Kenarlıklı, de: Umrandet, ru: Контурный, es: 'Con Contorno', fr: 'Avec Contour' } }
          - { value: soft, label: { en: 'Soft / Pastel', tr: 'Yumuşak Pastel', de: 'Sanft / Pastell', ru: 'Мягкий / Пастельный', es: 'Suave / Pastel', fr: 'Doux / Pastel' } }
          - { value: ghost, label: { en: 'Ghost', tr: 'Şeffaf', de: 'Geist', ru: 'Прозрачный', es: 'Fantasma', fr: 'Fantôme' } }
      button_color:
        type: select
        label:
          en: Color
          tr: Renk
          de: Farbe
          ru: Цвет
          es: Color
          fr: Couleur
        default: primary
        col_span: 6
        options:
          - { value: primary, label: { en: 'Primary Blue', tr: 'Birincil Mavi', de: Primärblau, ru: 'Основной синий', es: 'Azul Primario', fr: 'Bleu Primaire' } }
          - { value: dark, label: { en: 'Dark / Black', tr: 'Koyu / Siyah', de: 'Dunkel / Schwarz', ru: 'Тёмный / Чёрный', es: 'Oscuro / Negro', fr: 'Sombre / Noir' } }
          - { value: white, label: { en: White, tr: Beyaz, de: Weiß, ru: Белый, es: Blanco, fr: Blanc } }
          - { value: muted, label: { en: 'Muted Gray', tr: 'Açık Gri', de: 'Gedämpftes Grau', ru: 'Приглушённый серый', es: 'Gris Atenuado', fr: 'Gris Atténué' } }
      align:
        type: select
        label:
          en: 'Alignment'
          tr: 'Hizalama'
          de: 'Ausrichtung'
          ru: 'Выравнивание'
          es: 'Alineación'
          fr: 'Alignement'
        default: right
        col_span: 6
        options:
          - { value: right, label: { en: Right, tr: Sağa, de: Rechts, ru: Справа, es: Derecha, fr: Droite } }
          - { value: center, label: { en: Center, tr: Ortalı, de: Zentriert, ru: 'По центру', es: Centro, fr: Centre } }
          - { value: left, label: { en: Left, tr: Sola, de: Links, ru: Слева, es: Izquierda, fr: Gauche } }
      icon_position:
        type: select
        label:
          en: 'Icon Position'
          tr: 'İkon Konumu'
          de: Symbolposition
          ru: 'Позиция иконки'
          es: 'Posición del Icono'
          fr: "Position de l'Icône"
        default: left
        col_span: 6
        options:
          - { value: left, label: { en: 'Left', tr: 'Solda', de: 'Links', ru: 'Слева', es: 'Izquierda', fr: 'Gauche' } }
          - { value: right, label: { en: 'Right', tr: 'Sağda', de: 'Rechts', ru: 'Справа', es: 'Derecha', fr: 'Droite' } }
