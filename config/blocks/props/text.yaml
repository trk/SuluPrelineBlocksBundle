tabs:
  settings:
    title:
      en: Settings
      tr: Ayarlar
      de: Einstellungen
      ru: Настройки
      es: Ajustes
      fr: Paramètres
    fields:
      size:
        type: select
        label:
          en: 'Font Size'
          tr: 'Yazı Boyutu'
          de: Schriftgröße
          ru: 'Размер шрифта'
          es: 'Tamaño de Fuente'
          fr: 'Taille de Police'
        default: md
        col_span: 6
        options:
          - { value: sm, label: { en: Small, tr: 'Küçük', de: 'Klein', ru: 'Малый', es: 'Pequeño', fr: 'Petit' } }
          - { value: md, label: { en: Medium, tr: 'Standart', de: 'Mittel', ru: 'Средний', es: 'Mediano', fr: 'Moyen' } }
          - { value: lg, label: { en: Large, tr: 'Büyük', de: 'Groß', ru: 'Большой', es: 'Grande', fr: 'Grand' } }
          - { value: xl, label: { en: 'Extra Large', tr: 'Çok Büyük', de: 'Extra Groß', ru: 'Очень большой', es: 'Extra Grande', fr: 'Très Grand' } }
      text_style:
        type: select
        label:
          en: 'Text Style'
          tr: 'Metin Stili'
          de: Textstil
          ru: 'Стиль текста'
          es: 'Estilo de Texto'
          fr: 'Style de Texte'
        default: none
        col_span: 6
        options:
          - { value: none, label: { en: Default, tr: Varsayılan, de: Standard, ru: 'По умолчанию', es: Predeterminado, fr: 'Par Défaut' } }
          - { value: lead, label: { en: 'Lead Paragraph', tr: 'Giriş Paragrafı', de: 'Einleitungsabsatz', ru: 'Вводный абзац', es: 'Párrafo Destacado', fr: 'Paragraphe d’Introduction' } }
          - { value: meta, label: { en: 'Meta / Caption', tr: 'Meta / Açıklama', de: 'Meta / Bildunterschrift', ru: 'Мета / Подпись', es: 'Meta / Leyenda', fr: 'Méta / Légende' } }
          - { value: large, label: { en: 'Large Reading Text', tr: 'Geniş Okuma Metni', de: 'Großer Lesetext', ru: 'Крупный текст для чтения', es: 'Texto de Lectura Grande', fr: 'Grand Texte de Lecture' } }
          - { value: small, label: { en: 'Small Note', tr: 'Dipnot / Küçük Metin', de: 'Kleine Notiz', ru: 'Мелкая заметка', es: 'Nota Pequeña', fr: 'Petite Note' } }
      dropcap:
        type: select
        label:
          en: 'Drop Cap'
          tr: 'Büyük Baş Harf'
          de: 'Initiale'
          ru: 'Буквица'
          es: 'Letra Capital'
          fr: 'Lettrine'
        default: 'no'
        col_span: 6
        options:
          - { value: 'no', label: { en: Disabled, tr: Kapalı, de: Deaktiviert, ru: Отключено, es: Desactivado, fr: Désactivé } }
          - { value: 'yes', label: { en: Enabled, tr: Açık, de: Aktiviert, ru: Включено, es: Activado, fr: Activé } }
      column:
        type: select
        label:
          en: Columns
          tr: 'Metin Sütunları'
          de: Spalten
          ru: Колонки
          es: Columnas
          fr: Colonnes
        default: none
        col_span: 6
        options:
          - { value: none, label: { en: 'Single Column', tr: 'Tek Sütun', de: 'Einzelne Spalte', ru: 'Одна колонка', es: 'Columna Única', fr: 'Colonne Unique' } }
          - { value: 1-2, label: { en: '2 Columns', tr: '2 Sütun', de: '2 Spalten', ru: '2 колонки', es: '2 Columnas', fr: '2 Colonnes' } }
          - { value: 1-3, label: { en: '3 Columns', tr: '3 Sütun', de: '3 Spalten', ru: '3 колонки', es: '3 Columnas', fr: '3 Colonnes' } }
          - { value: 1-4, label: { en: '4 Columns', tr: '4 Sütun', de: '4 Spalten', ru: '4 колонки', es: '4 Columnas', fr: '4 Colonnes' } }
      column_divider:
        type: select
        label:
          en: 'Column Divider'
          tr: 'Sütun Ayracı'
          de: Spaltentrennlinie
          ru: 'Разделитель колонок'
          es: 'Divisor de Columnas'
          fr: 'Séparateur de Colonnes'
        default: 'no'
        col_span: 6
        options:
          - { value: 'no', label: { en: 'No', tr: Hayır, de: Nein, ru: Нет, es: 'No', fr: Non } }
          - { value: 'yes', label: { en: 'Yes', tr: 'Evet', de: 'Ja', ru: 'Да', es: 'Sí', fr: 'Oui' } }
      color:
        type: select
        label:
          en: 'Text Color'
          tr: 'Metin Rengi'
          de: Textfarbe
          ru: 'Цвет текста'
          es: 'Color de Texto'
          fr: 'Couleur du Texte'
        default: default
        col_span: 6
        options:
          - { value: default, label: { en: Default, tr: Varsayılan, de: Standard, ru: 'По умолчанию', es: Predeterminado, fr: 'Par Défaut' } }
          - { value: primary, label: { en: 'Primary Blue', tr: 'Birincil Mavi', de: Primärblau, ru: 'Основной синий', es: 'Azul Primario', fr: 'Bleu Primaire' } }
          - { value: secondary, label: { en: Secondary, tr: İkincil, de: Sekundär, ru: Вторичный, es: Secundario, fr: Secondaire } }
          - { value: dark, label: { en: Dark, tr: Koyu, de: Dunkel, ru: Тёмный, es: Oscuro, fr: Sombre } }
          - { value: white, label: { en: White, tr: Beyaz, de: Weiß, ru: Белый, es: Blanco, fr: Blanc } }
          - { value: muted, label: { en: Muted, tr: 'Soluk Gri', de: Gedämpft, ru: Приглушённый, es: Atenuado, fr: Atténué } }
