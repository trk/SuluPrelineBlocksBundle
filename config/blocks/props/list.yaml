tabs:
  settings:
    title:
      en: Settings
      tr: Ayarlar
      de: Einstellungen
      ru: Настройки
      es: Ajustes
      fr: Paramètres
    fields:
      list_type:
        type: select
        label:
          en: 'List Orientation'
          tr: 'Liste Yönü'
          de: Listenausrichtung
          ru: 'Ориентация списка'
          es: 'Orientación de la Lista'
          fr: 'Orientation de la Liste'
        default: vertical
        col_span: 6
        options:
          - { value: vertical, label: { en: 'Vertical Stack', tr: 'Dikey Liste', de: 'Vertikaler Stapel', ru: 'Вертикальный список', es: 'Pila Vertical', fr: 'Pile Verticale' } }
          - { value: horizontal, label: { en: 'Horizontal Inline', tr: 'Yatay Satır', de: 'Horizontal Inline', ru: 'Горизонтально в строку', es: 'Horizontal en Línea', fr: 'Horizontal en Ligne' } }
      columns:
        type: select
        label:
          en: 'Columns (Vertical Mode)'
          tr: 'Sütun Sayısı (Dikey Mod)'
          de: 'Spalten (Vertikaler Modus)'
          ru: 'Колонки (Вертикальный режим)'
          es: 'Columnas (Modo Vertical)'
          fr: 'Colonnes (Mode Vertical)'
        default: '1'
        col_span: 6
        options:
          - { value: '1', label: { en: '1 Column', tr: '1 Sütun', de: '1 Spalte', ru: '1 колонка', es: '1 Columna', fr: '1 Colonne' } }
          - { value: '2', label: { en: '2 Columns', tr: '2 Sütun', de: '2 Spalten', ru: '2 колонки', es: '2 Columnas', fr: '2 Colonnes' } }
          - { value: '3', label: { en: '3 Columns', tr: '3 Sütun', de: '3 Spalten', ru: '3 колонки', es: '3 Columnas', fr: '3 Colonnes' } }
      spacing:
        type: select
        label:
          en: 'Item Spacing'
          tr: 'Öğeler Arası Boşluk'
          de: Elementabstand
          ru: 'Отступ между элементами'
          es: 'Espaciado entre Elementos'
          fr: 'Espacement des Éléments'
        default: md
        col_span: 6
        options:
          - { value: sm, label: { en: 'Compact (sm)', tr: 'Dar (sm)', de: 'Kompakt (sm)', ru: 'Компактный (sm)', es: 'Compacto (sm)', fr: 'Compact (sm)' } }
          - { value: md, label: { en: 'Normal (md)', tr: 'Standart (md)', de: 'Normal (md)', ru: 'Обычный (md)', es: 'Normal (md)', fr: 'Normal (md)' } }
          - { value: lg, label: { en: 'Spacious (lg)', tr: 'Geniş (lg)', de: 'Geräumig (lg)', ru: 'Просторный (lg)', es: 'Espacioso (lg)', fr: 'Spacieux (lg)' } }
      size:
        type: select
        label:
          en: 'Text Size'
          tr: 'Metin Boyutu'
          de: Textgröße
          ru: 'Размер текста'
          es: 'Tamaño de Texto'
          fr: 'Taille du Texte'
        default: md
        col_span: 6
        options:
          - { value: sm, label: { en: 'Small (sm)', tr: 'Küçük (sm)', de: 'Klein (sm)', ru: 'Малый (sm)', es: 'Pequeño (sm)', fr: 'Petit (sm)' } }
          - { value: md, label: { en: 'Medium (md)', tr: 'Standart (md)', de: 'Mittel (md)', ru: 'Средний (md)', es: 'Mediano (md)', fr: 'Moyen (md)' } }
          - { value: lg, label: { en: 'Large (lg)', tr: 'Büyük (lg)', de: 'Groß (lg)', ru: 'Большой (lg)', es: 'Grande (lg)', fr: 'Grand (lg)' } }
      marker:
        type: select
        label:
          en: 'List Marker'
          tr: 'Madde İşaretçisi'
          de: Listenaufzählungszeichen
          ru: 'Маркер списка'
          es: 'Marcador de Lista'
          fr: 'Marqueur de Liste'
        default: none
        col_span: 6
        options:
          - { value: none, label: { en: None, tr: Yok, de: Keine, ru: Нет, es: Ninguno, fr: Aucun } }
          - { value: checkmark, label: { en: 'Checkmark Icon', tr: 'Onay İkonu (Check)', de: Häkchen-Symbol, ru: 'Иконка галочки', es: 'Icono de Verificación', fr: 'Icône Coche' } }
          - { value: icon, label: { en: 'Item Custom Icon', tr: 'Öğe Özel İkonu', de: 'Benutzerdefiniertes Elementsymbol', ru: 'Своя иконка элемента', es: 'Icono Personalizado del Elemento', fr: "Icône Personnalisée de l'Élément" } }
          - { value: disc, label: { en: 'Solid Bullet (Disc)', tr: 'Dolu Nokta (Disc)', de: 'Gefüllter Punkt (Disc)', ru: 'Сплошная точка (Disc)', es: 'Viñeta Sólida (Disco)', fr: 'Puce Pleine (Disque)' } }
          - { value: circle, label: { en: 'Outline Bullet (Circle)', tr: 'Çember Nokta (Circle)', de: Kreis-Aufzählungszeichen, ru: 'Контурный кружок (Circle)', es: 'Viñeta Circular (Círculo)', fr: 'Puce Cerclée (Cercle)' } }
          - { value: decimal, label: { en: 'Numbered (1, 2, 3)', tr: 'Numaralı (1, 2, 3)', de: 'Nummeriert (1, 2, 3)', ru: 'Нумерованный (1, 2, 3)', es: 'Numerado (1, 2, 3)', fr: 'Numéroté (1, 2, 3)' } }
      marker_color:
        type: select
        label:
          en: 'Marker Color'
          tr: 'İşaretçi Rengi'
          de: Markierungsfarbe
          ru: 'Цвет маркера'
          es: 'Color del Marcador'
          fr: 'Couleur du Marqueur'
        default: primary
        col_span: 6
        options:
          - { value: primary, label: { en: Primary, tr: 'Birincil Renk', de: Primär, ru: Основной, es: Primario, fr: Primaire } }
          - { value: secondary, label: { en: Secondary, tr: 'İkincil Renk', de: Sekundär, ru: Вторичный, es: Secundario, fr: Secondaire } }
          - { value: muted, label: { en: 'Muted / Neutral', tr: 'Nötr / Gri', de: 'Gedämpft / Neutral', ru: 'Приглушённый / Нейтральный', es: 'Atenuado / Neutro', fr: 'Atténué / Neutre' } }
      style:
        type: select
        label:
          en: 'Row Style'
          tr: 'Satır Stili'
          de: Zeilenstil
          ru: 'Стиль строки'
          es: 'Estilo de Fila'
          fr: 'Style de Ligne'
        default: default
        col_span: 6
        options:
          - { value: default, label: { en: 'Clean (Default)', tr: 'Sade (Varsayılan)', de: 'Schlicht (Standard)', ru: 'Чистый (По умолчанию)', es: 'Limpio (Predeterminado)', fr: 'Épuré (Par Défaut)' } }
          - { value: divider, label: { en: Divided, tr: 'Çizgi Ayırıcılı', de: 'Getrennt (Mit Linien)', ru: 'С разделителями', es: Dividido, fr: 'Avec Séparateurs' } }
          - { value: striped, label: { en: 'Striped Background', tr: 'Şeritli Arka Plan', de: 'Gestreifter Hintergrund', ru: 'Полосатый фон', es: 'Fondo Rayado', fr: 'Fond Rayé' } }
