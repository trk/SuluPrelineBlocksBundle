tabs:
  settings:
    title:
      en: Settings
      tr: Ayarlar
      de: Einstellungen
      ru: Настройки
      es: Ajustes
      fr: Paramètres
    fields:
      list_type:
        type: select
        label:
          en: 'List Orientation'
          tr: 'Liste Yönü'
          de: Listenausrichtung
          ru: 'Ориентация списка'
          es: 'Orientación de la Lista'
          fr: 'Orientation de la Liste'
        default: vertical
        col_span: 6
        options:
          - { value: vertical, label: { en: 'Vertical Stack', tr: 'Dikey Liste', de: 'Vertikaler Stapel', ru: 'Вертикальный список', es: 'Pila Vertical', fr: 'Pile Verticale' } }
          - { value: horizontal, label: { en: 'Horizontal Inline', tr: 'Yatay Satır', de: 'Horizontal Inline', ru: 'Горизонтально в строку', es: 'Horizontal en Línea', fr: 'Horizontal en Ligne' } }
      columns:
        type: select
        label:
          en: 'Columns'
          tr: 'Sütun Sayısı'
          de: 'Spalten'
          ru: 'Колонки'
          es: 'Columnas'
          fr: 'Colonnes'
        default: '1'
        col_span: 6
        options:
          - { value: '1', label: { en: '1 Column', tr: '1 Sütun', de: '1 Spalte', ru: '1 колонка', es: '1 Columna', fr: '1 Colonne' } }
          - { value: '2', label: { en: '2 Columns', tr: '2 Sütun', de: '2 Spalten', ru: '2 колонки', es: '2 Columnas', fr: '2 Colonnes' } }
          - { value: '3', label: { en: '3 Columns', tr: '3 Sütun', de: '3 Spalten', ru: '3 колонки', es: '3 Columnas', fr: '3 Colonnes' } }
      spacing:
        type: select
        label:
          en: 'Item Spacing'
          tr: 'Öğeler Arası Boşluk'
          de: Elementabstand
          ru: 'Отступ между элементами'
          es: 'Espaciado entre Elementos'
          fr: 'Espacement des Éléments'
        default: md
        col_span: 6
        options:
          - { value: sm, label: { en: 'Compact', tr: 'Dar', de: 'Kompakt', ru: 'Компактный', es: 'Compacto', fr: 'Compact' } }
          - { value: md, label: { en: 'Normal', tr: 'Standart', de: 'Normal', ru: 'Обычный', es: 'Normal', fr: 'Normal' } }
          - { value: lg, label: { en: 'Spacious', tr: 'Geniş', de: 'Geräumig', ru: 'Просторный', es: 'Espacioso', fr: 'Spacieux' } }
      size:
        type: select
        label:
          en: 'Text Size'
          tr: 'Metin Boyutu'
          de: Textgröße
          ru: 'Размер текста'
          es: 'Tamaño de Texto'
          fr: 'Taille du Texte'
        default: md
        col_span: 6
        options:
          - { value: sm, label: { en: 'Small', tr: 'Küçük', de: 'Klein', ru: 'Малый', es: 'Pequeño', fr: 'Petit' } }
          - { value: md, label: { en: 'Medium', tr: 'Standart', de: 'Mittel', ru: 'Средний', es: 'Mediano', fr: 'Moyen' } }
          - { value: lg, label: { en: 'Large', tr: 'Büyük', de: 'Groß', ru: 'Большой', es: 'Grande', fr: 'Grand' } }
      marker:
        type: select
        label:
          en: 'List Marker'
          tr: 'Madde İşaretçisi'
          de: Listenaufzählungszeichen
          ru: 'Маркер списка'
          es: 'Marcador de Lista'
          fr: 'Marqueur de Liste'
        default: none
        col_span: 6
        options:
          - { value: none, label: { en: None, tr: Yok, de: Keine, ru: Нет, es: Ninguno, fr: Aucun } }
          - { value: checkmark, label: { en: 'Checkmark Icon', tr: 'Onay İkonu', de: Häkchen-Symbol, ru: 'Иконка галочки', es: 'Icono de Verificación', fr: 'Icône Coche' } }
          - { value: icon, label: { en: 'Item Custom Icon', tr: 'Öğe Özel İkonu', de: 'Benutzerdefiniertes Elementsymbol', ru: 'Своя иконка элемента', es: 'Icono Personalizado del Elemento', fr: "Icône Personnalisée de l'Élément" } }
          - { value: disc, label: { en: 'Solid Bullet', tr: 'Dolu Nokta', de: 'Gefüllter Punkt', ru: 'Сплошная точка', es: 'Viñeta Sólida', fr: 'Puce Pleine' } }
          - { value: circle, label: { en: 'Outline Bullet', tr: 'Çember Nokta', de: Kreis-Aufzählungszeichen, ru: 'Контурный кружок', es: 'Viñeta Circular', fr: 'Puce Cerclée' } }
          - { value: decimal, label: { en: 'Numbered', tr: 'Numaralı', de: 'Nummeriert', ru: 'Нумерованный', es: 'Numerado', fr: 'Numéroté' } }
      marker_color:
        type: select
        label:
          en: 'Marker Color'
          tr: 'İşaretçi Rengi'
          de: Markierungsfarbe
          ru: 'Цвет маркера'
          es: 'Color del Marcador'
          fr: 'Couleur du Marqueur'
        default: primary
        col_span: 6
        options:
          - { value: primary, label: { en: Primary, tr: 'Birincil Renk', de: Primär, ru: Основной, es: Primario, fr: Primaire } }
          - { value: secondary, label: { en: Secondary, tr: 'İkincil Renk', de: Sekundär, ru: Вторичный, es: Secundario, fr: Secondaire } }
          - { value: muted, label: { en: 'Muted / Neutral', tr: 'Nötr / Gri', de: 'Gedämpft / Neutral', ru: 'Приглушённый / Нейтральный', es: 'Atenuado / Neutro', fr: 'Atténué / Neutre' } }
      style:
        type: select
        label:
          en: 'Row Style'
          tr: 'Satır Stili'
          de: Zeilenstil
          ru: 'Стиль строки'
          es: 'Estilo de Fila'
          fr: 'Style de Ligne'
        default: default
        col_span: 6
        options:
          - { value: default, label: { en: 'Clean', tr: 'Sade', de: 'Schlicht', ru: 'Чистый', es: 'Limpio', fr: 'Épuré' } }
          - { value: divider, label: { en: Divided, tr: 'Çizgi Ayırıcılı', de: 'Getrennt', ru: 'С разделителями', es: Dividido, fr: 'Avec Séparateurs' } }
          - { value: striped, label: { en: 'Striped Background', tr: 'Şeritli Arka Plan', de: 'Gestreifter Hintergrund', ru: 'Полосатый фон', es: 'Fondo Rayado', fr: 'Fond Rayé' } }
