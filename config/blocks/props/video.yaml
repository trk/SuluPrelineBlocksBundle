tabs:
  settings:
    title:
      en: Settings
      tr: Ayarlar
      de: Einstellungen
      ru: Настройки
      es: Ajustes
      fr: Paramètres
    fields:
      aspect_ratio:
        type: select
        label: sulu_block_suite.field_aspect_ratio
        col_span: 6
        options:
          - { value: 16/9, label: sulu_block_suite.opt_16_9 }
          - { value: 4/3, label: sulu_block_suite.opt_4_3 }
          - { value: 1/1, label: sulu_block_suite.opt_1_1 }
          - { value: 9/16, label: sulu_block_suite.opt_9_16 }
          - { value: 21/9, label: sulu_block_suite.opt_21_9 }
      rounded:
        type: select
        label: sulu_block_suite.field_rounded
        col_span: 6
        options:
          - { value: none, label: sulu_block_suite.opt_none }
          - { value: sm, label: sulu_block_suite.opt_sm }
          - { value: md, label: sulu_block_suite.opt_md }
          - { value: lg, label: sulu_block_suite.opt_lg }
          - { value: xl, label: sulu_block_suite.opt_xl }
          - { value: full, label: sulu_block_suite.opt_full }
      box_shadow:
        type: select
        label:
          en: 'Box Shadow'
          tr: Gölge
          de: Box-Schatten
          ru: 'Тень блока'
          es: 'Sombra de Caja'
          fr: 'Ombre Portée'
        col_span: 6
        options:
          - { value: none, label: { en: None, tr: Yok, de: Keine, ru: Нет, es: Ninguno, fr: Aucun } }
          - { value: sm, label: { en: Small, tr: Küçük, de: 'Klein', ru: 'Малый', es: 'Pequeño', fr: 'Petit' } }
          - { value: md, label: { en: Medium, tr: Orta, de: 'Mittel', ru: 'Средний', es: 'Mediano', fr: 'Moyen' } }
          - { value: lg, label: { en: Large, tr: Büyük, de: 'Groß', ru: 'Большой', es: 'Grande', fr: 'Grand' } }
          - { value: xl, label: { en: 'Extra Large', tr: 'Çok Büyük', de: 'Extra Groß', ru: 'Очень большой', es: 'Extra Grande', fr: 'Très Grand' } }
          - { value: 2xl, label: { en: '2X Large', tr: 'Geniş Derin Gölge', de: '2X Groß', ru: '2X Большой', es: '2X Grande', fr: '2X Grand' } }
      autoplay:
        type: select
        label:
          en: Autoplay
          tr: 'Otomatik Oynat'
          de: 'Automatische Wiedergabe'
          ru: Автовоспроизведение
          es: 'Reproducción Automática'
          fr: 'Lecture Automatique'
        col_span: 6
        options:
          - { value: none, label: { en: Disabled, tr: Kapalı, de: Deaktiviert, ru: Отключено, es: Desactivado, fr: Désactivé } }
          - { value: 'true', label: { en: 'Immediate', tr: 'Hemen Başlat', de: 'Sofort', ru: 'Сразу', es: 'Inmediato', fr: 'Immédiat' } }
          - { value: inview, label: { en: 'When in Viewport', tr: 'Ekrana Girdiğinde', de: 'Im sichtbaren Bereich', ru: 'При появлении на экране', es: 'Al Entrar en Pantalla', fr: "À l'Apparition à l'Écran" } }
          - { value: hover, label: { en: 'On Hover', tr: 'Üzerine Gelindiğinde', de: 'Bei Hover', ru: 'При наведении', es: 'Al Pasar el Cursor', fr: 'Au Survol' } }
      controls:
        type: select
        label:
          en: Controls
          tr: 'Oynatıcı Kontrolleri'
          de: Steuerelemente
          ru: 'Элементы управления'
          es: Controles
          fr: Contrôles
        col_span: 6
        options:
          - { value: 'true', label: { en: 'Show Controls', tr: 'Kontrolleri Göster', de: 'Steuerelemente anzeigen', ru: 'Показать управление', es: 'Mostrar Controles', fr: 'Afficher les Contrôles' } }
          - { value: 'false', label: { en: 'Hide Controls', tr: 'Kontrolleri Gizle', de: 'Steuerelemente ausblenden', ru: 'Скрыть управление', es: 'Ocultar Controles', fr: 'Masquer les Contrôles' } }
      loop:
        type: select
        label:
          en: Loop
          tr: 'Döngü'
          de: 'Schleife'
          ru: 'Зациклить'
          es: 'Bucle'
          fr: 'Boucle'
        col_span: 6
        options:
          - { value: 'false', label: { en: 'No', tr: Hayır, de: Nein, ru: Нет, es: 'No', fr: Non } }
          - { value: 'true', label: { en: 'Yes', tr: Evet, de: 'Ja', ru: 'Да', es: 'Sí', fr: 'Oui' } }
      muted:
        type: select
        label:
          en: 'Audio / Mute'
          tr: 'Ses Durumu'
          de: 'Audio / Stumm'
          ru: 'Звук / Без звука'
          es: 'Audio / Silencio'
          fr: 'Audio / Muet'
        col_span: 6
        options:
          - { value: default, label: { en: 'Default', tr: 'Varsayılan', de: 'Standard', ru: 'По умолчанию', es: 'Predeterminado', fr: 'Par Défaut' } }
          - { value: 'true', label: { en: Muted, tr: Sessiz, de: Gedämpft, ru: Приглушённый, es: Atenuado, fr: Atténué } }
          - { value: 'false', label: { en: Unmuted, tr: Sesli, de: 'Ton aktiv', ru: 'Со звуком', es: 'Con Sonido', fr: 'Avec Son' } }
