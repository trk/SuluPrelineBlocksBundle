tabs:
  appearance:
    title:
      en: "Typography & Decoration"
      tr: "Tipografi & Vurgu"
    fields:
      tag:
        type: select
        label:
          en: "HTML Element"
          tr: "HTML Başlık Etiketi"
        default: "h2"
        col_span: 6
        options:
          - value: "h1"
            label: "H1"
          - value: "h2"
            label: "H2"
          - value: "h3"
            label: "H3"
          - value: "h4"
            label: "H4"
          - value: "h5"
            label: "H5"
          - value: "h6"
            label: "H6"
          - value: "div"
            label: "DIV"
      size:
        type: select
        label:
          en: "Visual Size"
          tr: "Görsel Boyut"
        default: "lg"
        col_span: 6
        options:
          - value: "sm"
            label:
              en: "Small (sm)"
              tr: "Küçük (sm)"
          - value: "md"
            label:
              en: "Medium (md)"
              tr: "Standart (md)"
          - value: "lg"
            label:
              en: "Large (lg)"
              tr: "Büyük (lg)"
          - value: "xl"
            label:
              en: "Extra Large (xl)"
              tr: "Çok Büyük (xl)"
          - value: "2xl"
            label:
              en: "Hero Display (2xl)"
              tr: "Dev Manşet (2xl)"
      title_color:
        type: select
        label:
          en: "Heading Color"
          tr: "Başlık Rengi"
        default: "default"
        col_span: 6
        options:
          - value: "default"
            label:
              en: "Default Text"
              tr: "Varsayılan Metin"
          - value: "primary"
            label:
              en: "Primary Blue"
              tr: "Birincil Mavi"
          - value: "secondary"
            label:
              en: "Secondary"
              tr: "İkincil"
          - value: "dark"
            label:
              en: "Dark"
              tr: "Koyu"
          - value: "white"
            label:
              en: "White"
              tr: "Beyaz"
          - value: "muted"
            label:
              en: "Muted"
              tr: "Soluk Gri"
      title_decoration:
        type: select
        label:
          en: "Decoration"
          tr: "Başlık Vurgusu"
        default: "none"
        col_span: 6
        options:
          - value: "none"
            label:
              en: "None"
              tr: "Sade"
          - value: "divider"
            label:
              en: "Underline Accent"
              tr: "Altı Çizili Vurgu"
          - value: "bullet"
            label:
              en: "Left Bullet Bar"
              tr: "Sol Yan Çubuk"
          - value: "line"
            label:
              en: "Centered Horizontal Lines"
              tr: "İki Yanı Çizgili (Ortalı)"
      title_text_stroke:
        type: select
        label:
          en: "Text Stroke"
          tr: "İçi Boş Kontur (Outline)"
        default: "no"
        col_span: 6
        options:
          - value: "no"
            label:
              en: "Solid Text"
              tr: "Dolu Metin"
          - value: "yes"
            label:
              en: "Outline Text"
              tr: "İçi Boş Konturlu Metin"
      text_align:
        type: select
        label:
          en: "Alignment"
          tr: "Hizalama"
        default: "left"
        col_span: 6
        options:
          - value: "left"
            label:
              en: "Left"
              tr: "Sola Yaslı"
          - value: "center"
            label:
              en: "Center"
              tr: "Ortalı"
          - value: "right"
            label:
              en: "Right"
              tr: "Sağa Yaslı"
