tabs:
  settings:
    title:
      en: Settings
      tr: Ayarlar
      de: Einstellungen
      ru: Настройки
      es: Ajustes
      fr: Paramètres
    fields:
      trigger:
        type: select
        label:
          en: 'Trigger Mode'
          tr: 'Açılma Şekli'
          de: Auslösemodus
          ru: 'Режим активации'
          es: 'Modo de Activación'
          fr: 'Mode de Déclenchement'
        default: click
        col_span: 6
        options:
          - { value: click, label: { en: 'On Click', tr: 'Tıklama ile', de: 'Bei Klick', ru: 'По клику', es: 'Al Hacer Clic', fr: 'Au Clic' } }
          - { value: hover, label: { en: 'On Hover', tr: 'Üzerine Gelince', de: 'Bei Hover', ru: 'При наведении', es: 'Al Pasar el Cursor', fr: 'Au Survol' } }
      marker_type:
        type: select
        label:
          en: 'Default Marker Style'
          tr: 'Varsayılan İşaretçi Stili'
          de: Standard-Markierungsstil
          ru: 'Стиль маркера по умолчанию'
          es: 'Estilo de Marcador Predeterminado'
          fr: 'Style de Marqueur par Défaut'
        default: pulse
        col_span: 6
        options:
          - { value: pulse, label: { en: 'Radar Pulse', tr: 'Radar', de: Radar-Impuls, ru: 'Пульсирующий радар', es: 'Pulso de Radar', fr: 'Impulsion Radar' } }
          - { value: plus, label: { en: 'Plus', tr: 'Artı', de: 'Plus', ru: 'Плюс', es: 'Más', fr: 'Plus' } }
          - { value: number, label: { en: 'Numbered', tr: 'Numaralı', de: 'Nummeriert', ru: 'Нумерованный', es: 'Numerado', fr: 'Numéroté' } }
          - { value: dot, label: { en: 'Solid Dot', tr: 'Dolu Nokta', de: 'Gefüllter Punkt', ru: 'Сплошная точка', es: 'Punto Sólido', fr: 'Point Plein' } }
          - { value: pin, label: { en: 'Map Pin', tr: 'Harita İğnesi', de: Karten-Pin, ru: 'Булавка карты', es: 'Pin de Mapa', fr: 'Épingle de Carte' } }
          - { value: icon, label: { en: 'Custom Icon', tr: 'Özel İkon', de: 'Benutzerdefiniertes Symbol', ru: 'Своя иконка', es: 'Icono Personalizado', fr: 'Icône Personnalisée' } }
      marker_color:
        type: select
        label:
          en: 'Default Marker Color'
          tr: 'Varsayılan İşaretçi Rengi'
          de: Standard-Markierungsfarbe
          ru: 'Цвет маркера по умолчанию'
          es: 'Color de Marcador Predeterminado'
          fr: 'Couleur de Marqueur par Défaut'
        default: primary
        col_span: 6
        options:
          - { value: primary, label: { en: 'Primary', tr: 'Birincil', de: 'Primär', ru: 'Основной', es: 'Primario', fr: 'Primaire' } }
          - { value: dark, label: { en: 'Dark Neutral', tr: 'Koyu Gri', de: 'Dunkel Neutral', ru: Тёмно-нейтральный, es: 'Neutro Oscuro', fr: 'Neutre Sombre' } }
          - { value: light, label: { en: 'Light', tr: 'Açık / Beyaz', de: 'Hell', ru: 'Светлый', es: 'Claro', fr: 'Clair' } }
          - { value: accent, label: { en: 'Accent', tr: 'Vurgu', de: 'Akzent', ru: 'Акцент', es: 'Acento', fr: 'Accent' } }
          - { value: success, label: { en: 'Success', tr: 'Yeşil', de: 'Erfolg', ru: 'Успех', es: 'Éxito', fr: 'Succès' } }
          - { value: danger, label: { en: 'Danger', tr: 'Kırmızı', de: 'Gefahr', ru: 'Опасность', es: 'Peligro', fr: 'Danger' } }
