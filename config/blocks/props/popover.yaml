tabs:
  settings:
    title:
      en: Settings
      tr: Ayarlar
      de: Einstellungen
      ru: Настройки
      es: Ajustes
      fr: Paramètres
    fields:
      trigger:
        type: select
        label:
          en: 'Trigger Mode'
          tr: 'Açılma Şekli'
          de: Auslösemodus
          ru: 'Режим активации'
          es: 'Modo de Activación'
          fr: 'Mode de Déclenchement'
        default: click
        col_span: 6
        options:
          - { value: click, label: { en: 'On Click', tr: 'Tıklama ile (Click)', de: 'Bei Klick', ru: 'По клику', es: 'Al Hacer Clic', fr: 'Au Clic' } }
          - { value: hover, label: { en: 'On Hover', tr: 'Üzerine Gelince (Hover)', de: 'Bei Hover', ru: 'При наведении', es: 'Al Pasar el Cursor', fr: 'Au Survol' } }
      marker_type:
        type: select
        label:
          en: 'Default Marker Style'
          tr: 'Varsayılan İşaretçi Stili'
          de: Standard-Markierungsstil
          ru: 'Стиль маркера по умолчанию'
          es: 'Estilo de Marcador Predeterminado'
          fr: 'Style de Marqueur par Défaut'
        default: pulse
        col_span: 6
        options:
          - { value: pulse, label: { en: 'Radar Pulse', tr: 'Radar (Pulse)', de: Radar-Impuls, ru: 'Пульсирующий радар', es: 'Pulso de Radar', fr: 'Impulsion Radar' } }
          - { value: plus, label: { en: 'Plus (+)', tr: 'Artı (+)', de: 'Plus (+)', ru: 'Плюс (+)', es: 'Más (+)', fr: 'Plus (+)' } }
          - { value: number, label: { en: 'Numbered (1, 2, 3)', tr: 'Numaralı (1, 2, 3)', de: 'Nummeriert (1, 2, 3)', ru: 'Нумерованный (1, 2, 3)', es: 'Numerado (1, 2, 3)', fr: 'Numéroté (1, 2, 3)' } }
          - { value: dot, label: { en: 'Solid Dot', tr: 'Dolu Nokta', de: 'Gefüllter Punkt', ru: 'Сплошная точка', es: 'Punto Sólido', fr: 'Point Plein' } }
          - { value: pin, label: { en: 'Map Pin', tr: 'Harita İğnesi', de: Karten-Pin, ru: 'Булавка карты', es: 'Pin de Mapa', fr: 'Épingle de Carte' } }
          - { value: icon, label: { en: 'Custom Icon', tr: 'Özel İkon', de: 'Benutzerdefiniertes Symbol', ru: 'Своя иконка', es: 'Icono Personalizado', fr: 'Icône Personnalisée' } }
      marker_color:
        type: select
        label:
          en: 'Default Marker Color'
          tr: 'Varsayılan İşaretçi Rengi'
          de: Standard-Markierungsfarbe
          ru: 'Цвет маркера по умолчанию'
          es: 'Color de Marcador Predeterminado'
          fr: 'Couleur de Marqueur par Défaut'
        default: primary
        col_span: 6
        options:
          - { value: primary, label: { en: 'Primary (Blue)', tr: 'Birincil (Mavi)', de: 'Primär (Blau)', ru: 'Основной (Синий)', es: 'Primario (Azul)', fr: 'Primaire (Bleu)' } }
          - { value: dark, label: { en: 'Dark Neutral', tr: 'Koyu Gri', de: 'Dunkel Neutral', ru: Тёмно-нейтральный, es: 'Neutro Oscuro', fr: 'Neutre Sombre' } }
          - { value: light, label: { en: 'Light (White)', tr: 'Açık / Beyaz', de: 'Hell (Weiß)', ru: 'Светлый (Белый)', es: 'Claro (Blanco)', fr: 'Clair (Blanc)' } }
          - { value: accent, label: { en: 'Accent (Amber)', tr: 'Vurgu (Kehribar)', de: 'Akzent (Bernstein)', ru: 'Акцент (Янтарный)', es: 'Acento (Ámbar)', fr: 'Accent (Ambre)' } }
          - { value: success, label: { en: 'Success (Green)', tr: 'Yeşil (Başarılı)', de: 'Erfolg (Grün)', ru: 'Успех (Зелёный)', es: 'Éxito (Verde)', fr: 'Succès (Vert)' } }
          - { value: danger, label: { en: 'Danger (Red)', tr: 'Kırmızı (Tehlike)', de: 'Gefahr (Rot)', ru: 'Опасность (Красный)', es: 'Peligro (Rojo)', fr: 'Danger (Rouge)' } }
