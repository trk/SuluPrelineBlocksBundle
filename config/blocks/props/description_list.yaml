tabs:
  settings:
    title:
      en: Settings
      tr: Ayarlar
      de: Einstellungen
      ru: Настройки
      es: Ajustes
      fr: Paramètres
    fields:
      layout:
        type: select
        label:
          en: 'Layout Mode'
          tr: 'Yerleşim Modu'
          de: Layout-Modus
          ru: 'Режим компоновки'
          es: 'Modo de Diseño'
          fr: 'Mode de Disposition'
        default: horizontal
        col_span: 6
        options:
          - { value: horizontal, label: { en: 'Horizontal', tr: 'Yatay', de: 'Horizontal', ru: 'Горизонтально', es: 'Horizontal', fr: 'Horizontal' } }
          - { value: stacked, label: { en: 'Stacked', tr: 'Dikey', de: 'Gestapelt', ru: 'Вертикально', es: 'Apilado', fr: 'Empilé' } }
          - { value: striped, label: { en: 'Striped Rows', tr: 'Zebra Çizgili Satırlar', de: 'Gestreifte Zeilen', ru: 'Чередующиеся строки', es: 'Filas Rayadas', fr: 'Lignes Rayées' } }
          - { value: bordered, label: { en: 'Bordered Cards', tr: 'Çerçeveli Kartlar', de: 'Umrandete Karten', ru: 'Карточки с рамкой', es: 'Tarjetas con Borde', fr: 'Cartes Bordées' } }
      term_width:
        type: select
        label:
          en: 'Term Width'
          tr: 'Başlık Genişliği'
          de: 'Begriffsbreite'
          ru: 'Ширина термина'
          es: 'Ancho del Término'
          fr: 'Largeur du Terme'
        default: 1-3
        col_span: 6
        options:
          - { value: 1-4, label: { en: '25%', tr: '%25', de: '25%', ru: '25%', es: '25%', fr: '25%' } }
          - { value: 1-3, label: { en: '33%', tr: '%33', de: '33%', ru: '33%', es: '33%', fr: '33%' } }
          - { value: 1-2, label: { en: '50%', tr: '%50', de: '50%', ru: '50%', es: '50%', fr: '50%' } }
          - { value: auto, label: { en: Auto, tr: Otomatik, de: Auto, ru: Авто, es: Auto, fr: Auto } }
      divider:
        type: checkbox
        label:
          en: 'Show Dividers Between Items'
          tr: 'Maddeler Arasında Ayırıcı Çizgi'
          de: 'Trennlinien zwischen Elementen anzeigen'
          ru: 'Показать разделители между элементами'
          es: 'Mostrar Divisores Entre Elementos'
          fr: 'Afficher les Séparateurs Entre Éléments'
        default: true
        col_span: 6
      size:
        type: select
        label:
          en: 'Item Spacing & Size'
          tr: 'Madde Boyutu ve Boşluk'
          de: 'Elementabstand & Größe'
          ru: 'Отступы и размер элементов'
          es: 'Espaciado y Tamaño de Elementos'
          fr: 'Espacement et Taille des Éléments'
        default: md
        col_span: 6
        options:
          - { value: sm, label: { en: Small, tr: 'Küçük', de: 'Klein', ru: 'Малый', es: 'Pequeño', fr: 'Petit' } }
          - { value: md, label: { en: Medium, tr: 'Orta', de: 'Mittel', ru: 'Средний', es: 'Mediano', fr: 'Moyen' } }
          - { value: lg, label: { en: Large, tr: 'Büyük', de: 'Groß', ru: 'Большой', es: 'Grande', fr: 'Grand' } }
      term_style:
        type: select
        label:
          en: 'Term Font Style'
          tr: 'Terim Başlığı Stili'
          de: 'Schriftstil des Begriffs'
          ru: 'Стиль шрифта термина'
          es: 'Estilo de Fuente del Término'
          fr: 'Style de Police du Terme'
        default: bold
        col_span: 6
        options:
          - { value: bold, label: { en: Bold, tr: 'Kalın', de: 'Fett', ru: 'Жирный', es: 'Negrita', fr: 'Gras' } }
          - { value: medium, label: { en: Medium, tr: 'Orta', de: 'Mittel', ru: 'Средний', es: 'Medio', fr: 'Moyen' } }
          - { value: muted, label: { en: 'Muted', tr: 'Gri / Soluk', de: 'Gedämpft', ru: 'Приглушённый', es: 'Atenuado', fr: 'Atténué' } }
          - { value: primary, label: { en: 'Primary', tr: 'Birincil', de: 'Primär', ru: 'Основной', es: 'Primario', fr: 'Primaire' } }
