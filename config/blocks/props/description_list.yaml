tabs:
  settings:
    title:
      en: Settings
      tr: Ayarlar
      de: Einstellungen
      ru: Настройки
      es: Ajustes
      fr: Paramètres
    fields:
      layout:
        type: select
        label:
          en: 'Layout Mode'
          tr: 'Yerleşim Modu'
          de: Layout-Modus
          ru: 'Режим компоновки'
          es: 'Modo de Diseño'
          fr: 'Mode de Disposition'
        default: horizontal
        col_span: 6
        options:
          - { value: horizontal, label: { en: 'Horizontal (2 Columns Key-Value)', tr: 'Yatay (2 Kolonlu Terim-Açıklama)', de: 'Horizontal (2 Spalten Schlüssel-Wert)', ru: 'Горизонтально (2 колонки ключ-значение)', es: 'Horizontal (2 Columnas Clave-Valor)', fr: 'Horizontal (2 Colonnes Clé-Valeur)' } }
          - { value: stacked, label: { en: 'Stacked (Vertical)', tr: 'Dikey (Alt Alta)', de: 'Gestapelt (Vertikal)', ru: 'Вертикально (Стопкой)', es: 'Apilado (Vertical)', fr: 'Empilé (Vertical)' } }
          - { value: striped, label: { en: 'Striped Rows (Zebra)', tr: 'Zebra Çizgili Satırlar', de: 'Gestreifte Zeilen (Zebra)', ru: 'Чередующиеся строки (Зебра)', es: 'Filas Rayadas (Cebra)', fr: 'Lignes Rayées (Zèbre)' } }
          - { value: bordered, label: { en: 'Bordered Cards', tr: 'Çerçeveli Kartlar', de: 'Umrandete Karten', ru: 'Карточки с рамкой', es: 'Tarjetas con Borde', fr: 'Cartes Bordées' } }
      term_width:
        type: select
        label:
          en: 'Term Width (Horizontal)'
          tr: 'Başlık Genişliği (Yatayda)'
          de: 'Begriffsbreite (Horizontal)'
          ru: 'Ширина термина (Горизонтально)'
          es: 'Ancho del Término (Horizontal)'
          fr: 'Largeur du Terme (Horizontal)'
        default: 1-3
        col_span: 6
        options:
          - { value: 1-4, label: { en: '25% (1/4)', tr: '%25 (1/4)', de: '25% (1/4)', ru: '25% (1/4)', es: '25% (1/4)', fr: '25% (1/4)' } }
          - { value: 1-3, label: { en: '33% (1/3)', tr: '%33 (1/3)', de: '33% (1/3)', ru: '33% (1/3)', es: '33% (1/3)', fr: '33% (1/3)' } }
          - { value: 1-2, label: { en: '50% (1/2)', tr: '%50 (1/2)', de: '50% (1/2)', ru: '50% (1/2)', es: '50% (1/2)', fr: '50% (1/2)' } }
          - { value: auto, label: { en: Auto, tr: Otomatik, de: Auto, ru: Авто, es: Auto, fr: Auto } }
      divider:
        type: checkbox
        label:
          en: 'Show Dividers Between Items'
          tr: 'Maddeler Arasında Ayırıcı Çizgi'
          de: 'Trennlinien zwischen Elementen anzeigen'
          ru: 'Показать разделители между элементами'
          es: 'Mostrar Divisores Entre Elementos'
          fr: 'Afficher les Séparateurs Entre Éléments'
        default: true
        col_span: 6
      size:
        type: select
        label:
          en: 'Item Spacing & Size'
          tr: 'Madde Boyutu ve Boşluk'
          de: 'Elementabstand & Größe'
          ru: 'Отступы и размер элементов'
          es: 'Espaciado y Tamaño de Elementos'
          fr: 'Espacement et Taille des Éléments'
        default: md
        col_span: 6
        options:
          - { value: sm, label: { en: Small, tr: 'Küçük (sm)', de: 'Klein (sm)', ru: 'Малый (sm)', es: 'Pequeño (sm)', fr: 'Petit (sm)' } }
          - { value: md, label: { en: Medium, tr: 'Orta (md)', de: 'Mittel (md)', ru: 'Средний (md)', es: 'Mediano (md)', fr: 'Moyen (md)' } }
          - { value: lg, label: { en: Large, tr: 'Büyük (lg)', de: 'Groß (lg)', ru: 'Большой (lg)', es: 'Grande (lg)', fr: 'Grand (lg)' } }
      term_style:
        type: select
        label:
          en: 'Term Font Style'
          tr: 'Terim Başlığı Stili'
          de: 'Schriftstil des Begriffs'
          ru: 'Стиль шрифта термина'
          es: 'Estilo de Fuente del Término'
          fr: 'Style de Police du Terme'
        default: bold
        col_span: 6
        options:
          - { value: bold, label: { en: Bold, tr: 'Kalın (Bold)', de: 'Fett (Bold)', ru: 'Жирный (Bold)', es: 'Negrita (Bold)', fr: 'Gras (Bold)' } }
          - { value: medium, label: { en: Medium, tr: 'Orta (Medium)', de: 'Mittel (Medium)', ru: 'Средний (Medium)', es: 'Medio (Medium)', fr: 'Moyen (Medium)' } }
          - { value: muted, label: { en: 'Muted (Gray)', tr: 'Gri / Soluk (Muted)', de: 'Gedämpft (Grau)', ru: 'Приглушённый (Серый)', es: 'Atenuado (Gris)', fr: 'Atténué (Gris)' } }
          - { value: primary, label: { en: 'Primary (Accent)', tr: 'Birincil (Vurgulu)', de: 'Primär (Akzent)', ru: 'Основной (Акцент)', es: 'Primario (Acento)', fr: 'Primaire (Accent)' } }
