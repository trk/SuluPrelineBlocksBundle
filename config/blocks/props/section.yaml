tabs:
  settings:
    title:
      en: Settings
      tr: Ayarlar
      de: Einstellungen
      ru: Настройки
      es: Ajustes
      fr: Paramètres
    fields:
      max_width:
        type: select
        label:
          en: 'Container Max Width'
          tr: 'Konteyner Azami Genişliği'
          de: 'Maximale Container-Breite'
          ru: 'Максимальная ширина контейнера'
          es: 'Ancho Máximo del Contenedor'
          fr: 'Largeur Maximale du Contenedor'
        default: 85rem
        col_span: 6
        options:
          - { value: 85rem, label: { en: 'Preline Standard', tr: 'Preline Standart', de: 'Preline Standard', ru: 'Стандарт Preline', es: 'Estándar Preline', fr: 'Standard Preline' } }
          - { value: 7xl, label: { en: 'Extra Large', tr: 'Geniş', de: 'Extra Groß', ru: 'Очень большой', es: 'Extra Grande', fr: 'Très Grand' } }
          - { value: 5xl, label: { en: 'Medium', tr: 'Orta', de: 'Mittel', ru: 'Средний', es: 'Mediano', fr: 'Moyen' } }
          - { value: 3xl, label: { en: 'Narrow / Prose', tr: 'Dar', de: 'Schmal / Text', ru: 'Узкий / Текст', es: 'Estrecho / Texto', fr: 'Étroit / Texte' } }
          - { value: full, label: { en: 'Full Width', tr: 'Tam Genişlik', de: 'Volle Breite', ru: 'Во всю ширину', es: 'Ancho Completo', fr: 'Pleine Largeur' } }
      padding_y:
        type: select
        label:
          en: 'Vertical Padding'
          tr: 'Dikey İç Boşluk'
          de: 'Vertikaler Innenabstand'
          ru: 'Вертикальный внутренний отступ'
          es: 'Relleno Vertical'
          fr: 'Marge Intérieure Verticale'
        default: default
        col_span: 6
        options:
          - { value: default, label: { en: 'Default', tr: 'Standart', de: 'Standard', ru: 'По умолчанию', es: 'Predeterminado', fr: 'Par Défaut' } }
          - { value: none, label: { en: 'None', tr: 'Yok', de: 'Keine', ru: 'Нет', es: 'Ninguno', fr: 'Aucun' } }
          - { value: xs, label: { en: 'Extra Small', tr: 'Çok Küçük', de: 'Extra Klein', ru: 'Очень малый', es: 'Extra Pequeño', fr: 'Très Petit' } }
          - { value: sm, label: { en: 'Small', tr: 'Küçük', de: 'Klein', ru: 'Малый', es: 'Pequeño', fr: 'Petit' } }
          - { value: lg, label: { en: 'Large', tr: 'Büyük', de: 'Groß', ru: 'Большой', es: 'Grande', fr: 'Grand' } }
          - { value: xl, label: { en: 'Extra Large', tr: 'Çok Büyük', de: 'Extra Groß', ru: 'Очень большой', es: 'Extra Grande', fr: 'Très Grand' } }
      padding_x:
        type: select
        label:
          en: 'Horizontal Padding'
          tr: 'Yatay İç Boşluk'
          de: 'Horizontaler Innenabstand'
          ru: 'Горизонтальный внутренний отступ'
          es: 'Relleno Horizontal'
          fr: 'Marge Intérieure Horizontale'
        default: default
        col_span: 6
        options:
          - { value: default, label: { en: 'Default', tr: Standart, de: 'Standard', ru: 'По умолчанию', es: Predeterminado, fr: 'Par Défaut' } }
          - { value: none, label: { en: 'None', tr: 'Yok', de: 'Keine', ru: 'Нет', es: 'Ninguno', fr: 'Aucun' } }
      bg_style:
        type: select
        label:
          en: 'Background Style'
          tr: 'Arka Plan Stili'
          de: Hintergrund-Stil
          ru: 'Стиль фона'
          es: 'Estilo de Fondo'
          fr: 'Style de Fond'
        default: transparent
        col_span: 6
        options:
          - { value: transparent, label: { en: Transparent, tr: Şeffaf, de: Transparent, ru: Прозрачный, es: Transparente, fr: Transparent } }
          - { value: default, label: { en: 'Surface', tr: 'Yüzey', de: 'Oberfläche', ru: 'Поверхность', es: 'Superficie', fr: 'Surface' } }
          - { value: muted, label: { en: 'Muted', tr: 'Mat', de: 'Gedämpft', ru: 'Приглушённый', es: 'Atenuado', fr: 'Atténué' } }
          - { value: subtle, label: { en: 'Subtle Background', tr: 'Hafif Arka Plan', de: 'Dezenter Hintergrund', ru: 'Лёгкий фон', es: 'Fondo Sutil', fr: 'Fond Subtil' } }
          - { value: primary, label: { en: 'Primary Brand Theme', tr: 'Birincil Vurgu Rengi', de: 'Primäres Markenthema', ru: 'Основная тема бренда', es: 'Tema de Marca Primario', fr: 'Thème de Marque Primaire' } }
          - { value: secondary, label: { en: 'Secondary Brand Theme', tr: 'İkincil Vurgu Rengi', de: 'Sekundäres Markenthema', ru: 'Вторичная тема бренда', es: 'Tema de Marca Secundario', fr: 'Thème de Marque Secondaire' } }
          - { value: dark, label: { en: 'Dark Inverted', tr: 'Koyu / Siyah', de: 'Dunkel Invertiert', ru: 'Тёмный инвертированный', es: 'Oscuro Invertido', fr: 'Sombre Inversé' } }
      has_border:
        type: checkbox
        label:
          en: 'Top & Bottom Borders'
          tr: 'Üst ve Alt Kenarlıklar'
          de: ' Rahmen oben & unten'
          ru: 'Верхняя и нижняя границы'
          es: 'Bordes Superior e Inferior'
          fr: 'Bordures Haut et Bas'
        default: false
        col_span: 6
