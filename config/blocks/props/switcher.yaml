tabs:
  settings:
    title:
      en: Settings
      tr: Ayarlar
      de: Einstellungen
      ru: Настройки
      es: Ajustes
      fr: Paramètres
    fields:
      nav_position:
        type: select
        label:
          en: 'Tab Bar Position'
          tr: 'Sekme Çubuğu Konumu'
          de: Tab-Leisten-Position
          ru: 'Позиция панели вкладок'
          es: 'Posición de Barra de Pestañas'
          fr: "Position de la Barre d'Onglets"
        default: top
        col_span: 6
        options:
          - { value: top, label: { en: Top, tr: Üstte, de: Oben, ru: Сверху, es: Arriba, fr: Haut } }
          - { value: bottom, label: { en: Bottom, tr: Altta, de: Unten, ru: Снизу, es: Abajo, fr: Bas } }
          - { value: left, label: { en: 'Left', tr: 'Solda', de: 'Links', ru: 'Слева', es: 'Izquierda', fr: 'Gauche' } }
          - { value: right, label: { en: 'Right', tr: 'Sağda', de: 'Rechts', ru: 'Справа', es: 'Derecha', fr: 'Droite' } }
      nav_style:
        type: select
        label:
          en: 'Tab Style'
          tr: 'Sekme Stili'
          de: Tab-Stil
          ru: 'Стиль вкладок'
          es: 'Estilo de Pestaña'
          fr: "Style d'Onglet"
        default: pills
        col_span: 6
        options:
          - { value: pills, label: { en: Pills, tr: 'Kapsül Butonlar', de: 'Pillen', ru: 'Капсулы', es: 'Píldoras', fr: 'Pilules' } }
          - { value: segmented, label: { en: 'Segmented Control', tr: 'Bölümlü Kontrol', de: 'Segmentierte Steuerung', ru: 'Сегментированный переключатель', es: 'Control Segmentado', fr: 'Contrôle Segmenté' } }
          - { value: underline, label: { en: Underline, tr: 'Alt Çizgili', de: Unterstrichen, ru: Подчёркивание, es: Subrayado, fr: Souligné } }
          - { value: bordered, label: { en: Bordered, tr: Kenarlıklı, de: Umrandet, ru: 'С рамкой', es: 'Con Borde', fr: Bordé } }
      alignment:
        type: select
        label:
          en: 'Tab Alignment'
          tr: 'Sekme Hizalaması'
          de: 'Tab-Ausrichtung'
          ru: 'Выравнивание вкладок'
          es: 'Alineación de Pestañas'
          fr: 'Alignement des Onglets'
        default: start
        col_span: 6
        options:
          - { value: start, label: { en: 'Left / Start', tr: Sola, de: 'Links / Start', ru: 'Слева / В начале', es: 'Izquierda / Inicio', fr: 'Gauche / Début' } }
          - { value: center, label: { en: Center, tr: Ortalı, de: Zentriert, ru: 'По центру', es: Centro, fr: Centre } }
          - { value: end, label: { en: 'Right / End', tr: Sağa, de: 'Rechts / Ende', ru: 'Справа / В конце', es: 'Derecha / Fin', fr: 'Droite / Fin' } }
          - { value: full, label: { en: 'Full Width', tr: 'Tam Genişlik', de: 'Volle Breite', ru: 'Во всю ширину', es: 'Ancho Completo', fr: 'Pleine Largeur' } }
