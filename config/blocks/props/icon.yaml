tabs:
  settings:
    title:
      en: Settings
      tr: Ayarlar
      de: Einstellungen
      ru: Настройки
      es: Ajustes
      fr: Paramètres
    fields:
      icon_style:
        type: select
        label:
          en: 'Icon Presentation'
          tr: 'İkon Sunumu'
          de: Symbol-Darstellung
          ru: 'Представление иконки'
          es: 'Presentación del Icono'
          fr: "Présentation de l'Icône"
        default: plain
        col_span: 6
        options:
          - { value: plain, label: { en: 'Plain Icon', tr: 'Sade İkon', de: 'Einfaches Symbol', ru: 'Простая иконка', es: 'Icono Simple', fr: 'Icône Simple' } }
          - { value: circle_solid, label: { en: 'Solid Circle Badge', tr: 'Dolu Yuvarlak Rozet', de: 'Gefüllter Kreis-Badge', ru: 'Сплошной круглый значок', es: 'Insignia Circular Sólida', fr: 'Badge Circulaire Plein' } }
          - { value: circle_outline, label: { en: 'Outlined Circle', tr: 'Kenarlıklı Yuvarlak', de: 'Umrandeter Kreis', ru: 'Контурный круг', es: 'Círculo con Contorno', fr: 'Cercle avec Contour' } }
          - { value: square_soft, label: { en: 'Soft Square Box', tr: 'Yumuşak Kare Kutu', de: 'Sanfte quadratische Box', ru: 'Мягкий квадратный блок', es: 'Caja Cuadrada Suave', fr: 'Boîte Carrée Douce' } }
      icon_size:
        type: select
        label:
          en: Size
          tr: Boyut
          de: Größe
          ru: Размер
          es: Tamaño
          fr: Taille
        default: md
        col_span: 6
        options:
          - { value: sm, label: { en: 'Small', tr: 'Küçük', de: 'Klein', ru: 'Малый', es: 'Pequeño', fr: 'Petit' } }
          - { value: md, label: { en: 'Medium', tr: 'Orta', de: 'Mittel', ru: 'Средний', es: 'Mediano', fr: 'Moyen' } }
          - { value: lg, label: { en: 'Large', tr: 'Büyük', de: 'Groß', ru: 'Большой', es: 'Grande', fr: 'Grand' } }
          - { value: xl, label: { en: 'Extra Large', tr: 'Çok Büyük', de: 'Extra Groß', ru: 'Очень большой', es: 'Extra Grande', fr: 'Très Grand' } }
          - { value: 2xl, label: { en: 'Huge', tr: 'Dev', de: 'Riesig', ru: 'Огромный', es: 'Enorme', fr: 'immense' } }
      icon_color:
        type: select
        label:
          en: Color
          tr: Renk
          de: Farbe
          ru: Цвет
          es: Color
          fr: Couleur
        default: primary
        col_span: 6
        options:
          - { value: primary, label: { en: 'Primary Blue', tr: 'Birincil Mavi', de: Primärblau, ru: 'Основной синий', es: 'Azul Primario', fr: 'Bleu Primaire' } }
          - { value: secondary, label: { en: 'Secondary Indigo', tr: 'İkincil İndigo', de: 'Sekundär Indigo', ru: 'Вторичный индиго', es: 'Índigo Secundario', fr: 'Indigo Secondaire' } }
          - { value: dark, label: { en: 'Dark / Black', tr: 'Koyu / Siyah', de: 'Dunkel / Schwarz', ru: 'Тёмный / Чёрный', es: 'Oscuro / Negro', fr: 'Sombre / Noir' } }
          - { value: muted, label: { en: 'Muted Gray', tr: 'Açık Gri', de: 'Gedämpftes Grau', ru: 'Приглушённый серый', es: 'Gris Atenuado', fr: 'Gris Atténué' } }
          - { value: success, label: { en: 'Success Green', tr: 'Yeşil', de: Erfolgsgrün, ru: 'Зелёный', es: 'Verde Éxito', fr: 'Vert Succès' } }
          - { value: danger, label: { en: 'Danger Red', tr: 'Kırmızı', de: Gefahrenrot, ru: 'Красный', es: 'Rojo Peligro', fr: 'Rouge Danger' } }
          - { value: white, label: { en: White, tr: Beyaz, de: Weiß, ru: Белый, es: Blanco, fr: Blanc } }
      align:
        type: select
        label:
          en: Alignment
          tr: Hizalama
          de: Ausrichtung
          ru: Выравнивание
          es: Alineación
          fr: Alignement
        default: left
        col_span: 6
        options:
          - { value: left, label: { en: Left, tr: Sola, de: Links, ru: Слева, es: Izquierda, fr: Gauche } }
          - { value: center, label: { en: Center, tr: Ortalı, de: Zentriert, ru: 'По центру', es: Centro, fr: Centre } }
          - { value: right, label: { en: Right, tr: Sağa, de: Rechts, ru: Справа, es: Derecha, fr: Droite } }
