          - { value: 'large', label: sulu_block_suite.opt_large }
          - { value: 'xlarge', label: sulu_block_suite.opt_xlarge }
          - { value: '2xlarge', label: sulu_block_suite.opt_2xlarge }
      block_align:
        type: select
        label: sulu_block_suite.field_block_align
        col_span: 6
        options:
          - { value: 'left', label: sulu_block_suite.opt_left }
          - { value: 'center', label: sulu_block_suite.opt_center }
          - { value: 'right', label: sulu_block_suite.opt_right }
  advanced:
    title: sulu_block_suite.tabs_advanced
    fields:
      id:
        type: text
        label: sulu_block_suite.field_id
        placeholder: sulu_block_suite.placeholder_id
        col_span: 12
      custom_class:
        type: text
        label: sulu_block_suite.field_custom_class
        placeholder: sulu_block_suite.placeholder_custom_class
        col_span: 12
