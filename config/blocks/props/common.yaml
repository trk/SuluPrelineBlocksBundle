tabs:
  appearance:
    title: sulu_block_suite.tabs_appearance
    fields:
      variant:
        type: select
        label: sulu_block_suite.field_variant
        col_span: 6
        options:
          - { value: 'solid', label: sulu_block_suite.opt_solid }
          - { value: 'outline', label: sulu_block_suite.opt_outline }
          - { value: 'ghost', label: sulu_block_suite.opt_ghost }
          - { value: 'link', label: sulu_block_suite.opt_link }
          - { value: 'bordered', label: sulu_block_suite.opt_bordered }
          - { value: 'shadow', label: sulu_block_suite.opt_shadow }
          - { value: 'flat', label: sulu_block_suite.opt_flat }
      size:
        type: select
        label: sulu_block_suite.field_size
        col_span: 6
        options:
          - { value: 'sm', label: sulu_block_suite.opt_sm }
          - { value: 'md', label: sulu_block_suite.opt_md }
          - { value: 'lg', label: sulu_block_suite.opt_lg }
          - { value: 'xl', label: sulu_block_suite.opt_xl }
          - { value: '2xl', label: sulu_block_suite.opt_2xl }
      color:
        type: select
        label: sulu_block_suite.field_color
        col_span: 6
        options:
          - { value: 'default', label: sulu_block_suite.opt_default }
          - { value: 'primary', label: sulu_block_suite.opt_primary }
          - { value: 'secondary', label: sulu_block_suite.opt_secondary }
          - { value: 'dark', label: sulu_block_suite.opt_dark }
          - { value: 'white', label: sulu_block_suite.opt_white }
          - { value: 'muted', label: sulu_block_suite.opt_muted }
