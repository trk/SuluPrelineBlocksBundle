tabs:
  settings:
    title:
      en: Settings
      tr: Ayarlar
      de: Einstellungen
      ru: Настройки
      es: Ajustes
      fr: Paramètres
    fields:
      col_span:
        type: select
        label:
          en: 'Column Width'
          tr: 'Sütun Genişliği'
          de: 'Spaltenbreite'
          ru: 'Ширина колонки'
          es: 'Ancho de Columna'
          fr: 'Largeur de Colonne'
        default: auto
        col_span: 6
        options:
          - { value: auto, label: { en: 'Auto', tr: 'Otomatik', de: 'Auto', ru: 'Авто', es: 'Auto', fr: 'Auto' } }
          - { value: '12', label: { en: '12/12 - Full Width', tr: '12/12 - Tam Genişlik', de: '12/12 - Volle Breite', ru: '12/12 - Во всю ширину', es: '12/12 - Ancho Completo', fr: '12/12 - Pleine Largeur' } }
          - { value: '10', label: { en: '10/12 - Five Sixths', tr: '10/12 - Altıda Beş', de: '10/12 - Fünf Sechstel', ru: '10/12 - Пять шестых', es: '10/12 - Cinco Sextos', fr: '10/12 - Cinq Sixièmes' } }
          - { value: '9', label: { en: '9/12 - Three Quarters', tr: '9/12 - Dörtte Üç', de: '9/12 - Drei Viertel', ru: '9/12 - Три четверти', es: '9/12 - Tres Cuartos', fr: '9/12 - Trois Quarts' } }
          - { value: '8', label: { en: '8/12 - Two Thirds', tr: '8/12 - Üçte İki', de: '8/12 - Zwei Drittel', ru: '8/12 - Две трети', es: '8/12 - Dos Tercios', fr: '8/12 - Deux Tiers' } }
          - { value: '7', label: { en: '7/12 - Seven Twelfths', tr: '7/12 - On İkide Yedi', de: '7/12 - Sieben Zwölftel', ru: '7/12 - Семь двенадцатых', es: '7/12 - Siete Doceavos', fr: '7/12 - Sept Douzièmes' } }
          - { value: '6', label: { en: '6/12 - Half', tr: '6/12 - Yarım', de: '6/12 - Hälfte', ru: '6/12 - Половина', es: '6/12 - Mitad', fr: '6/12 - Moitié' } }
          - { value: '5', label: { en: '5/12 - Five Twelfths', tr: '5/12 - On İkide Beş', de: '5/12 - Fünf Zwölftel', ru: '5/12 - Пять двенадцатых', es: '5/12 - Cinco Doceavos', fr: '5/12 - Cinq Douzièmes' } }
          - { value: '4', label: { en: '4/12 - One Third', tr: '4/12 - Üçte Bir', de: '4/12 - Ein Drittel', ru: '4/12 - Одна треть', es: '4/12 - Un Tercio', fr: '4/12 - Un Tiers' } }
          - { value: '3', label: { en: '3/12 - One Quarter', tr: '3/12 - Çeyrek', de: '3/12 - Ein Viertel', ru: '3/12 - Одна четверть', es: '3/12 - Un Cuarto', fr: '3/12 - Un Quart' } }
          - { value: '2', label: { en: '2/12 - One Sixth', tr: '2/12 - Altıda Bir', de: '2/12 - Ein Sechstel', ru: '2/12 - Одна шестая', es: '2/12 - Un Sexto', fr: '2/12 - Un Sixième' } }
      vertical_align:
        type: select
        label:
          en: 'Vertical Alignment'
          tr: 'Dikey Hizalama'
          de: 'Vertikale Ausrichtung'
          ru: 'Вертикальное выравнивание'
          es: 'Alineación Vertical'
          fr: 'Alignement Vertical'
        default: top
        col_span: 6
        options:
          - { value: top, label: { en: Top, tr: Üst, de: Oben, ru: Сверху, es: Arriba, fr: Haut } }
          - { value: center, label: { en: Center, tr: Orta, de: Zentriert, ru: 'По центру', es: Centro, fr: Centre } }
          - { value: bottom, label: { en: Bottom, tr: Alt, de: Unten, ru: Снизу, es: Abajo, fr: Bas } }
          - { value: between, label: { en: 'Space Between', tr: 'İki Yana Yasla', de: 'Raum dazwischen', ru: 'Равномерно по краям', es: 'Espacio Entre Elementos', fr: 'Espacement Entre' } }
      order:
        type: select
        label:
          en: 'Responsive Order'
          tr: 'Duyarlı Sıralama'
          de: 'Responsive Reihenfolge'
          ru: 'Адаптивный порядок'
          es: 'Orden Responsivo'
          fr: 'Ordre Responsive'
        default: default
        col_span: 6
        options:
          - { value: default, label: { en: 'Default Order', tr: 'Varsayılan Sıra', de: Standardreihenfolge, ru: 'Порядок по умолчанию', es: 'Orden Predeterminado', fr: 'Ordre par Défaut' } }
          - { value: first, label: { en: 'First on Mobile, Natural on Desktop', tr: 'Mobilde İlk, Masaüstünde Normal', de: 'Mobil zuerst, Desktop normal', ru: 'Первый на мобильных, обычный на ПК', es: 'Primero en Móvil, Normal en Escritorio', fr: 'Premier sur Mobile, Normal sur Bureau' } }
          - { value: last, label: { en: 'Last on Mobile, Natural on Desktop', tr: 'Mobilde Son, Masaüstünde Normal', de: 'Mobil zuletzt, Desktop normal', ru: 'Последний на мобильных, обычный на ПК', es: 'Último en Móvil, Normal en Escritorio', fr: 'Dernier sur Mobile, Normal sur Bureau' } }
      is_sticky:
        type: checkbox
        label:
          en: 'Sticky on Scroll'
          tr: 'Kaydırmada Sabitle'
          de: 'Beim Scrollen fixieren'
          ru: 'Закрепить при прокрутке'
          es: 'Fijar al Desplazar'
          fr: 'Épingler au Défilement'
        default: false
        col_span: 6
      style:
        type: select
        label:
          en: 'Card / Box Style'
          tr: 'Kart / Kutu Stili'
          de: 'Karten- / Box-Stil'
          ru: 'Стиль карточки / блока'
          es: 'Estilo de Tarjeta / Caja'
          fr: 'Style de Carte / Boîte'
        default: none
        col_span: 6
        options:
          - { value: none, label: { en: 'None', tr: 'Yok', de: 'Keine', ru: 'Нет', es: 'Ninguno', fr: 'Aucun' } }
          - { value: card, label: { en: 'Card', tr: 'Kart', de: 'Karte', ru: 'Карточка', es: 'Tarjeta', fr: 'Carte' } }
          - { value: muted, label: { en: 'Muted', tr: 'Mat', de: 'Gedämpft', ru: 'Приглушённый', es: 'Atenuado', fr: 'Atténué' } }
          - { value: subtle, label: { en: 'Subtle Background', tr: 'Hafif Zemin', de: 'Dezenter Hintergrund', ru: 'Лёгкий фон', es: 'Fondo Sutil', fr: 'Fond Subtil' } }
          - { value: primary_subtle, label: { en: 'Primary Accent Subtle', tr: 'Vurgu Rengi Hafif', de: 'Primärer Akzent', ru: 'Мягкий основной акцент', es: 'Acento Primario Sutil', fr: 'Accent Primaire Subtil' } }
      padding:
        type: select
        label:
          en: 'Inner Padding'
          tr: 'İç Boşluk'
          de: 'Innenabstand'
          ru: 'Внутренний отступ'
          es: 'Relleno Interior'
          fr: 'Marge Intérieure'
        default: none
        col_span: 6
        options:
          - { value: none, label: { en: None, tr: Yok, de: Keine, ru: Нет, es: Ninguno, fr: Aucun } }
          - { value: sm, label: { en: 'Small', tr: 'Küçük', de: 'Klein', ru: 'Малый', es: 'Pequeño', fr: 'Petit' } }
          - { value: md, label: { en: 'Medium', tr: 'Orta', de: 'Mittel', ru: 'Средний', es: 'Mediano', fr: 'Moyen' } }
          - { value: lg, label: { en: 'Large', tr: 'Büyük', de: 'Groß', ru: 'Большой', es: 'Grande', fr: 'Grand' } }
