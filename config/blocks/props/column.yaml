tabs:
  settings:
    title:
      en: Settings
      tr: Ayarlar
      de: Einstellungen
      ru: Настройки
      es: Ajustes
      fr: Paramètres
    fields:
      col_span:
        type: select
        label:
          en: 'Column Width (Grid Span)'
          tr: 'Sütun Genişliği'
          de: 'Spaltenbreite (Raster)'
          ru: 'Ширина колонки (Сетка)'
          es: 'Ancho de Columna (Cuadrícula)'
          fr: 'Largeur de Colonne (Grille)'
        default: auto
        col_span: 6
        options:
          - { value: auto, label: { en: 'Auto (Inherit from Row)', tr: 'Otomatik (Satırdan Al)', de: 'Auto (Von Zeile übernehmen)', ru: 'Авто (Из строки)', es: 'Auto (Heredar de Fila)', fr: 'Auto (Hériter de la Ligne)' } }
          - { value: '12', label: { en: '12/12 - Full Width (100%)', tr: '12/12 - Tam Genişlik (%100)', de: '12/12 - Volle Breite (100%)', ru: '12/12 - Во всю ширину (100%)', es: '12/12 - Ancho Completo (100%)', fr: '12/12 - Pleine Largeur (100%)' } }
          - { value: '10', label: { en: '10/12 - Five Sixths (83.3%)', tr: '10/12 - Altıda Beş (%83.3)', de: '10/12 - Fünf Sechstel (83.3%)', ru: '10/12 - Пять шестых (83.3%)', es: '10/12 - Cinco Sextos (83.3%)', fr: '10/12 - Cinq Sixièmes (83.3%)' } }
          - { value: '9', label: { en: '9/12 - Three Quarters (75%)', tr: '9/12 - Dörtte Üç (%75)', de: '9/12 - Drei Viertel (75%)', ru: '9/12 - Три четверти (75%)', es: '9/12 - Tres Cuartos (75%)', fr: '9/12 - Trois Quarts (75%)' } }
          - { value: '8', label: { en: '8/12 - Two Thirds (66.6%)', tr: '8/12 - Üçte İki (%66.6)', de: '8/12 - Zwei Drittel (66.6%)', ru: '8/12 - Две трети (66.6%)', es: '8/12 - Dos Tercios (66.6%)', fr: '8/12 - Deux Tiers (66.6%)' } }
          - { value: '7', label: { en: '7/12 - Seven Twelfths (58.3%)', tr: '7/12 - On İkide Yedi (%58.3)', de: '7/12 - Sieben Zwölftel (58.3%)', ru: '7/12 - Семь двенадцатых (58.3%)', es: '7/12 - Siete Doceavos (58.3%)', fr: '7/12 - Sept Douzièmes (58.3%)' } }
          - { value: '6', label: { en: '6/12 - Half (50%)', tr: '6/12 - Yarım (%50)', de: '6/12 - Hälfte (50%)', ru: '6/12 - Половина (50%)', es: '6/12 - Mitad (50%)', fr: '6/12 - Moitié (50%)' } }
          - { value: '5', label: { en: '5/12 - Five Twelfths (41.6%)', tr: '5/12 - On İkide Beş (%41.6)', de: '5/12 - Fünf Zwölftel (41.6%)', ru: '5/12 - Пять двенадцатых (41.6%)', es: '5/12 - Cinco Doceavos (41.6%)', fr: '5/12 - Cinq Douzièmes (41.6%)' } }
          - { value: '4', label: { en: '4/12 - One Third (33.3%)', tr: '4/12 - Üçte Bir (%33.3)', de: '4/12 - Ein Drittel (33.3%)', ru: '4/12 - Одна треть (33.3%)', es: '4/12 - Un Tercio (33.3%)', fr: '4/12 - Un Tiers (33.3%)' } }
          - { value: '3', label: { en: '3/12 - One Quarter (25%)', tr: '3/12 - Çeyrek (%25)', de: '3/12 - Ein Viertel (25%)', ru: '3/12 - Одна четверть (25%)', es: '3/12 - Un Cuarto (25%)', fr: '3/12 - Un Quart (25%)' } }
          - { value: '2', label: { en: '2/12 - One Sixth (16.6%)', tr: '2/12 - Altıda Bir (%16.6)', de: '2/12 - Ein Sechstel (16.6%)', ru: '2/12 - Одна шестая (16.6%)', es: '2/12 - Un Sexto (16.6%)', fr: '2/12 - Un Sixième (16.6%)' } }
      vertical_align:
        type: select
        label:
          en: 'Vertical Alignment'
          tr: 'Dikey Hizalama'
          de: 'Vertikale Ausrichtung'
          ru: 'Вертикальное выравнивание'
          es: 'Alineación Vertical'
          fr: 'Alignement Vertical'
        default: top
        col_span: 6
        options:
          - { value: top, label: { en: Top, tr: Üst, de: Oben, ru: Сверху, es: Arriba, fr: Haut } }
          - { value: center, label: { en: Center, tr: Orta, de: Zentriert, ru: 'По центру', es: Centro, fr: Centre } }
          - { value: bottom, label: { en: Bottom, tr: Alt, de: Unten, ru: Снизу, es: Abajo, fr: Bas } }
          - { value: between, label: { en: 'Space Between', tr: 'İki Yana Yasla', de: 'Raum dazwischen', ru: 'Равномерно по краям', es: 'Espacio Entre Elementos', fr: 'Espacement Entre' } }
      order:
        type: select
        label:
          en: 'Responsive Order'
          tr: 'Duyarlı Sıralama'
          de: 'Responsive Reihenfolge'
          ru: 'Адаптивный порядок'
          es: 'Orden Responsivo'
          fr: 'Ordre Responsive'
        default: default
        col_span: 6
        options:
          - { value: default, label: { en: 'Default Order', tr: 'Varsayılan Sıra', de: Standardreihenfolge, ru: 'Порядок по умолчанию', es: 'Orden Predeterminado', fr: 'Ordre par Défaut' } }
          - { value: first, label: { en: 'First on Mobile, Natural on Desktop', tr: 'Mobilde İlk, Masaüstünde Normal', de: 'Mobil zuerst, Desktop normal', ru: 'Первый на мобильных, обычный на ПК', es: 'Primero en Móvil, Normal en Escritorio', fr: 'Premier sur Mobile, Normal sur Bureau' } }
          - { value: last, label: { en: 'Last on Mobile, Natural on Desktop', tr: 'Mobilde Son, Masaüstünde Normal', de: 'Mobil zuletzt, Desktop normal', ru: 'Последний на мобильных, обычный на ПК', es: 'Último en Móvil, Normal en Escritorio', fr: 'Dernier sur Mobile, Normal sur Bureau' } }
      is_sticky:
        type: checkbox
        label:
          en: 'Sticky on Scroll'
          tr: 'Kaydırmada Sabitle (Sticky)'
          de: 'Beim Scrollen fixieren (Sticky)'
          ru: 'Закрепить при прокрутке (Sticky)'
          es: 'Fijar al Desplazar (Sticky)'
          fr: 'Épingler au Défilement (Sticky)'
        default: false
        col_span: 6
      style:
        type: select
        label:
          en: 'Card / Box Style'
          tr: 'Kart / Kutu Stili'
          de: 'Karten- / Box-Stil'
          ru: 'Стиль карточки / блока'
          es: 'Estilo de Tarjeta / Caja'
          fr: 'Style de Carte / Boîte'
        default: none
        col_span: 6
        options:
          - { value: none, label: { en: 'None (Transparent)', tr: 'Yok (Şeffaf)', de: 'Keine (Transparent)', ru: 'Нет (Прозрачный)', es: 'Ninguno (Transparente)', fr: 'Aucun (Transparent)' } }
          - { value: card, label: { en: 'Card (Surface + Border + Shadow)', tr: 'Kart (Zemin + Kenarlık + Gölge)', de: 'Karte (Oberfläche + Rahmen + Schatten)', ru: 'Карточка (Фон + Рамка + Тень)', es: 'Tarjeta (Superficie + Borde + Sombra)', fr: 'Carte (Surface + Bordure + Ombre)' } }
          - { value: muted, label: { en: 'Muted (Gray Surface)', tr: 'Mat (Gri Zemin)', de: 'Gedämpft (Graue Fläche)', ru: 'Приглушённый (Серый фон)', es: 'Atenuado (Superficie Gris)', fr: 'Atténué (Surface Grise)' } }
          - { value: subtle, label: { en: 'Subtle Background', tr: 'Hafif Zemin', de: 'Dezenter Hintergrund', ru: 'Лёгкий фон', es: 'Fondo Sutil', fr: 'Fond Subtil' } }
          - { value: primary_subtle, label: { en: 'Primary Accent Subtle', tr: 'Vurgu Rengi Hafif', de: 'Primärer Akzent (Dezent)', ru: 'Мягкий основной акцент', es: 'Acento Primario Sutil', fr: 'Accent Primaire Subtil' } }
      padding:
        type: select
        label:
          en: 'Inner Padding'
          tr: 'İç Boşluk (Padding)'
          de: 'Innenabstand (Padding)'
          ru: 'Внутренний отступ (Padding)'
          es: 'Relleno Interior (Padding)'
          fr: 'Marge Intérieure (Padding)'
        default: none
        col_span: 6
        options:
          - { value: none, label: { en: None, tr: Yok, de: Keine, ru: Нет, es: Ninguno, fr: Aucun } }
          - { value: sm, label: { en: 'Small (p-4)', tr: 'Küçük (p-4)', de: 'Klein (p-4)', ru: 'Малый (p-4)', es: 'Pequeño (p-4)', fr: 'Petit (p-4)' } }
          - { value: md, label: { en: 'Medium (p-6 sm:p-8)', tr: 'Orta (p-6 sm:p-8)', de: 'Mittel (p-6 sm:p-8)', ru: 'Средний (p-6 sm:p-8)', es: 'Mediano (p-6 sm:p-8)', fr: 'Moyen (p-6 sm:p-8)' } }
          - { value: lg, label: { en: 'Large (p-8 sm:p-10)', tr: 'Büyük (p-8 sm:p-10)', de: 'Groß (p-8 sm:p-10)', ru: 'Большой (p-8 sm:p-10)', es: 'Grande (p-8 sm:p-10)', fr: 'Grand (p-8 sm:p-10)' } }
